name: Release

# The release train. A version bump merged to main starts it:
#
#   config ─► proof + tests ─► build (6 targets) ─► draft ─► smoke (6 installs) ─► publish-beta
#                                                     │                                 │
#                                                     └─► provenance ───────────────────┘
#
#   1. `config` only goes ahead when src-tauri/tauri.conf.json names a version
#      that has no tag yet AND RELEASE_NOTES.md names that version on its
#      first line. Anything else is a no-op push to main.
#      `proof` then requires the commit to have passed CI's `gate` check.
#   2. Installers are built, signed and notarized from the merged commit.
#   3. A DRAFT release is created (nobody can see or download it), assets and
#      manifests are uploaded and linted (every updater bundle must carry a
#      signature that verifies against the app's public key).
#   4. Every installer (DMG, .deb, AppImage, NSIS) is installed on a clean
#      runner of its own platform and the app is started with `--self-test`,
#      which must exit 0.
#   5. Only then is the tag created on the merged commit and the release
#      published as a PRERELEASE: the beta channel (channels/beta.json) points
#      at it, while `releases/latest` (stable clients) is untouched.
#   6. promote.yml flips it to the latest release after the soak period.
#
# Tags are never moved: a re-run with an existing tag must point at the same
# commit or it fails. A failed candidate is fixed by shipping the next version.
# Trains never overlap: pushes to main queue behind the running train, and a
# draft is only ever reused by a re-run of the commit that created it. A
# draft left behind by a failed train is refused by `config`, before anything
# is built: delete it or bump the version to release again.
#
# Dry run: `workflow_dispatch` with a throwaway tag such as v0.0.0-dryrun-3
# runs the whole train up to and including smoke on a draft that is deleted
# at the end. Nothing is published and no tag is created.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run_tag:
        description: "Dry run: throwaway tag name (e.g. v0.0.0-dryrun-3). Builds this ref, drafts, smokes, then deletes the draft."
        required: true
        type: string
      platforms:
        description: "Platforms to build (comma-separated: macos,linux,windows or 'all')"
        required: true
        default: "all"
        type: string

# One train at a time. Every push to main queues behind the running train
# (a later push that finds the tag already created is a no-op), so two runs
# can never draft, upload or tag the same version from different commits.
# Dry runs use their own throwaway tag and queue separately.
concurrency:
  group: release-${{ inputs.dry_run_tag || 'main' }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  SOAK_NOTE: "Published to the beta channel first; promoted to stable after the soak period."

jobs:
  # ── Decide whether this commit is a release ────────────────────────
  config:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.decide.outputs.release }}
      dry_run: ${{ steps.decide.outputs.dry_run }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      sha: ${{ steps.decide.outputs.sha }}
      build_macos: ${{ steps.platforms.outputs.macos }}
      build_linux: ${{ steps.platforms.outputs.linux }}
      build_windows: ${{ steps.platforms.outputs.windows }}
      expect_keys: ${{ steps.platforms.outputs.expect_keys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN_TAG: ${{ inputs.dry_run_tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          SHA="$GITHUB_SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          if [[ -n "$DRY_RUN_TAG" ]]; then
            if [[ ! "$DRY_RUN_TAG" =~ ^v0\.0\.0-dryrun-[0-9A-Za-z.-]+$ ]]; then
              echo "::error::dry_run_tag must look like v0.0.0-dryrun-N, got '$DRY_RUN_TAG'"; exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$DRY_RUN_TAG" >/dev/null 2>&1; then
              echo "::error::tag $DRY_RUN_TAG already exists — pick a new N"; exit 1
            fi
            if gh release view "$DRY_RUN_TAG" >/dev/null 2>&1; then
              echo "::error::a release named $DRY_RUN_TAG already exists — delete it or pick a new N"; exit 1
            fi
            echo "tag=$DRY_RUN_TAG" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Dry run: building $SHA as $DRY_RUN_TAG (version $VERSION in the app)"
          else
            TAG="v$VERSION"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$TAG already exists — nothing to release for this push."
              exit 0
            fi
            # A draft left by a failed train belongs to the commit that made
            # it. Refusing it here, before anything is built, keeps every
            # later push to main from spending an hour of runners only to
            # be refused at the draft step. Delete that draft (or bump the
            # version) to release again; see docs/releasing.md.
            EXISTING=$(gh release view "$TAG" --json isDraft,targetCommitish 2>/dev/null || true)
            if [[ -n "$EXISTING" ]]; then
              IS_DRAFT=$(jq -r '.isDraft' <<<"$EXISTING")
              TARGET=$(jq -r '.targetCommitish' <<<"$EXISTING")
              if [[ "$IS_DRAFT" != "true" ]]; then
                echo "::error::a release named $TAG is already published without its tag — a release is never rebuilt in place"; exit 1
              fi
              if [[ "$TARGET" != "$SHA" ]]; then
                echo "::error::draft $TAG was made by a failed train for $TARGET, not $SHA — delete that draft (gh release delete $TAG) or bump the version; drafts are never reused across commits"; exit 1
              fi
              echo "Draft $TAG already exists for $SHA (re-run) — it will be reused"
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Release candidate: $TAG from $SHA"
          fi

      # Hand-written notes are the only source of the release text. The
      # first line must name the version ("# Hermes IDE 1.4.1").
      - name: Release notes gate
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! -f RELEASE_NOTES.md ]]; then
            echo "::error::RELEASE_NOTES.md is missing — a release needs hand-written notes"; exit 1
          fi
          FIRST=$(head -n 1 RELEASE_NOTES.md)
          if ! node -e '
            const [line, v] = process.argv.slice(1);
            const re = new RegExp("(^|[^0-9.])" + v.replace(/\./g, "\\.") + "([^0-9.]|$)");
            process.exit(re.test(line) ? 0 : 1);
          ' "$FIRST" "$VERSION"; then
            echo "::error::RELEASE_NOTES.md must name $VERSION on its first line (found: '$FIRST')"; exit 1
          fi
          echo "Release notes are for $VERSION"

      - id: platforms
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          P="$INPUT_PLATFORMS"
          [[ "$P" == "all" || "$P" == *macos* ]]   && M=true || M=false
          [[ "$P" == "all" || "$P" == *linux* ]]   && L=true || L=false
          [[ "$P" == "all" || "$P" == *windows* ]] && W=true || W=false
          echo "macos=$M"   >> "$GITHUB_OUTPUT"
          echo "linux=$L"   >> "$GITHUB_OUTPUT"
          echo "windows=$W" >> "$GITHUB_OUTPUT"
          KEYS=""
          [[ "$M" == true ]] && KEYS="$KEYS,darwin-aarch64,darwin-x86_64"
          [[ "$L" == true ]] && KEYS="$KEYS,linux-x86_64-deb,linux-aarch64-deb,linux-x86_64-appimage,linux-aarch64-appimage,linux-x86_64,linux-aarch64"
          [[ "$W" == true ]] && KEYS="$KEYS,windows-x86_64,windows-aarch64"
          echo "expect_keys=${KEYS#,}" >> "$GITHUB_OUTPUT"

  # ── Proof gate ──────────────────────────────────────────────────────
  # A release is only built from a commit that passed CI's `gate` check —
  # the real-app scenarios on macOS, Windows and Linux plus the acceptance
  # ledger (e2e/acceptance.yml). A commit CI never ran on, or one whose
  # check is red, is not released. Waits for a check that is still running,
  # and, while CI's own workflow run for the commit is still going, for the
  # check to exist at all: on a push to main, CI and this workflow start at
  # the same moment, and GitHub registers the `gate` check run only when CI
  # reaches that job, i.e. after every other CI job has finished.
  proof:
    needs: config
    if: needs.config.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      - name: The released commit passed the CI gate and the ledger is well-formed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node e2e/release-gate.mjs --sha "$(git rev-parse HEAD^{commit})" --check gate --ci-workflow ci.yml --wait-minutes 90 --missing-grace-minutes 15

  # ── Frontend tests ─────────────────────────────────────────────────
  test-frontend:
    needs: config
    if: needs.config.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npx vitest run

  # ── Rust tests on every platform we ship ───────────────────────────
  test-rust:
    needs: config
    if: needs.config.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            enabled: ${{ needs.config.outputs.build_macos }}
          - os: ubuntu-22.04
            enabled: ${{ needs.config.outputs.build_linux }}
          - os: windows-2022
            enabled: ${{ needs.config.outputs.build_windows }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip if platform not selected
        if: matrix.enabled != 'true'
        run: echo "Skipping Rust tests for this platform"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        if: matrix.enabled == 'true'
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        if: matrix.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        if: matrix.enabled == 'true'

      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: matrix.enabled == 'true'
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.os }}-v3

      - name: Cache apt packages
        if: matrix.enabled == 'true' && runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      # The cache action ignores apt failures (e.g. mirror 404s) and can
      # save/restore an empty cache, leaving the build without glib/gtk.
      - name: Ensure system libraries are installed
        if: matrix.enabled == 'true' && runner.os == 'Linux'
        run: |
          if ! pkg-config --exists glib-2.0 gtk+-3.0 gdk-3.0 webkit2gtk-4.1 libsoup-3.0 javascriptcoregtk-4.1; then
            echo "apt cache incomplete, installing packages directly"
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          fi

      # Stages the bridge's deps into src-tauri/bridge/node_modules/; the
      # build (prepare:bridge) packs them into the runtime archive the
      # bundle ships (scripts/pack-bridge-runtime.mjs, ADR 002).
      - name: Install npm deps + stage bridge runtime
        if: matrix.enabled == 'true'
        run: npm ci

      - name: Build PTY helper (needed by tests on macOS)
        if: matrix.enabled == 'true' && runner.os == 'macOS'
        working-directory: src-tauri/pty-setup
        run: cargo build --target-dir ../target

      - name: Run Rust tests
        if: matrix.enabled == 'true'
        working-directory: src-tauri
        run: cargo test --locked

  # ── Build installers ───────────────────────────────────────────────
  build:
    needs: [config, proof, test-frontend, test-rust]
    if: needs.config.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            platform_key: darwin-aarch64
            sign: true
            notarize: true
            platform_group: macos
          - target: x86_64-apple-darwin
            runner: macos-15
            platform_key: darwin-x86_64
            sign: true
            notarize: true
            platform_group: macos
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04 # glibc 2.35 floor for the .deb
            platform_key: linux-x86_64
            sign: false
            notarize: false
            platform_group: linux
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            platform_key: linux-aarch64
            sign: false
            notarize: false
            platform_group: linux
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            platform_key: windows-x86_64
            sign: false
            notarize: false
            platform_group: windows
          - target: aarch64-pc-windows-msvc
            runner: windows-2022
            platform_key: windows-aarch64
            sign: false
            notarize: false
            platform_group: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check if this platform is enabled
        id: check
        shell: bash
        run: |
          GROUP="${{ matrix.platform_group }}"
          MACOS="${{ needs.config.outputs.build_macos }}"
          LINUX="${{ needs.config.outputs.build_linux }}"
          WINDOWS="${{ needs.config.outputs.build_windows }}"
          ENABLED=false
          [[ "$GROUP" == "macos"   && "$MACOS"   == "true" ]] && ENABLED=true
          [[ "$GROUP" == "linux"   && "$LINUX"   == "true" ]] && ENABLED=true
          [[ "$GROUP" == "windows" && "$WINDOWS" == "true" ]] && ENABLED=true
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        if: steps.check.outputs.enabled == 'true'
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        if: steps.check.outputs.enabled == 'true'

      - name: Install cross-compilation target
        if: steps.check.outputs.enabled == 'true'
        run: rustup target add ${{ matrix.target }}

      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: steps.check.outputs.enabled == 'true'
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.runner }}

      - name: Cache apt packages
        if: steps.check.outputs.enabled == 'true' && runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          version: 1.0

      # Same guard as in test-rust: an empty apt cache must not break the build.
      - name: Ensure system libraries are installed
        if: steps.check.outputs.enabled == 'true' && runner.os == 'Linux'
        run: |
          if ! pkg-config --exists glib-2.0 gtk+-3.0 gdk-3.0 webkit2gtk-4.1 libsoup-3.0 javascriptcoregtk-4.1; then
            echo "apt cache incomplete, installing packages directly"
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          fi

      - run: npm ci
        if: steps.check.outputs.enabled == 'true'

      # linuxdeploy and appimagetool are AppImages themselves: they need FUSE 2
      # (libfuse2 on 22.04, libfuse2t64 on 24.04).
      - name: FUSE for the AppImage tools (Linux)
        if: steps.check.outputs.enabled == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Import macOS signing certificate
        if: steps.check.outputs.enabled == 'true' && matrix.sign && runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "::warning::No signing certificate available — building unsigned (fork or missing secret)"
            exit 0
          fi
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      # macOS terminals need the small `hermes-pty-setup` helper next to the
      # app binary. It goes in as a Tauri external binary so the bundler
      # puts it (signed) into the .app before the DMG and the updater
      # archive are made. Copying it in afterwards left the DMG without it.
      # The agent launch helper `hi` (src-tauri/hi) goes in the same way, so
      # it is signed and inside Contents/MacOS next to the app binary.
      - name: Build PTY and launch helpers (macOS)
        if: steps.check.outputs.enabled == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }} \
            --manifest-path src-tauri/pty-setup/Cargo.toml --target-dir src-tauri/target
          cargo build --release --locked --target ${{ matrix.target }} \
            --manifest-path src-tauri/hi/Cargo.toml --target-dir src-tauri/target/hi-build
          mkdir -p src-tauri/binaries
          cp "src-tauri/target/${{ matrix.target }}/release/hermes-pty-setup" \
            "src-tauri/binaries/hermes-pty-setup-${{ matrix.target }}"
          cp "src-tauri/target/hi-build/${{ matrix.target }}/release/hi" \
            "src-tauri/binaries/hi-${{ matrix.target }}"
          ls -la src-tauri/binaries/

      - name: Build and sign
        if: steps.check.outputs.enabled == 'true'
        shell: bash
        env:
          CI: false
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "${{ matrix.sign && secrets.APPLE_SIGNING_IDENTITY || '' }}"
        # Linux: .deb and AppImage, each its own updater bundle. The bridge
        # runtime ships as one packed archive (ADR 002), which is what lets
        # linuxdeploy bundle the AppImage again.
        # Windows: NSIS only. The updater installs with NSIS, so an MSI install
        # would end up with two copies after its first update.
        run: |
          if [[ "${{ matrix.platform_group }}" == 'linux' ]]; then
            npx tauri build --target ${{ matrix.target }} --bundles deb,appimage
          elif [[ "${{ matrix.platform_group }}" == 'windows' ]]; then
            npx tauri build --target ${{ matrix.target }} --bundles nsis
          else
            npx tauri build --target ${{ matrix.target }} \
              --config '{"bundle":{"externalBin":["binaries/hermes-pty-setup","binaries/hi"]}}'
          fi

      - name: Check the macOS bundle carries the PTY and launch helpers
        if: steps.check.outputs.enabled == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
          test -x "$APP/Contents/MacOS/hermes-pty-setup"
          test -x "$APP/Contents/MacOS/hi"
          "$APP/Contents/MacOS/hi" --version
          TAR_GZ=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz | head -1)
          tar -tzf "$TAR_GZ" | grep -q 'Contents/MacOS/hermes-pty-setup$'
          tar -tzf "$TAR_GZ" | grep -q 'Contents/MacOS/hi$'
          echo "hermes-pty-setup and hi are in the app and in the updater archive"

      - name: Notarize DMG
        if: steps.check.outputs.enabled == 'true' && matrix.notarize
        timeout-minutes: 30
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_ID" ]; then
            echo "::warning::No notarization credentials — skipping (fork or missing secret)"
            exit 0
          fi
          DMG_PATH=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          NOTARIZED=false
          for attempt in 1 2 3; do
            echo "Notarization attempt $attempt of 3..."
            if xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 8m; then
              NOTARIZED=true
              break
            fi
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 15s..."
              sleep 15
            fi
          done
          if [ "$NOTARIZED" != "true" ]; then
            echo "::error::All 3 notarization attempts failed"
            exit 1
          fi
          xcrun stapler staple "$DMG_PATH"

      - name: Collect installer artifacts
        if: steps.check.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p installer-artifacts
          shopt -s nullglob
          # macOS DMG
          for f in "$TARGET_DIR"/dmg/*.dmg; do cp "$f" installer-artifacts/; done
          # Linux .deb and AppImage — Tauri signs both at build time; each is
          # the updater bundle for its own installs.
          for f in "$TARGET_DIR"/deb/*.deb "$TARGET_DIR"/appimage/*.AppImage; do
            cp "$f" installer-artifacts/
            [ -f "$f.sig" ] && cp "$f.sig" installer-artifacts/
          done
          # Windows NSIS
          for f in "$TARGET_DIR"/nsis/*-setup.exe; do cp "$f" installer-artifacts/; done
          shopt -u nullglob
          echo "=== installer artifacts ==="
          ls -la installer-artifacts/
          [ "$(ls installer-artifacts | wc -l)" -gt 0 ] || { echo "::error::no installer produced"; exit 1; }

      - name: Upload installer artifacts
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-ide-${{ matrix.platform_key }}-installer
          path: installer-artifacts/
          retention-days: 7

      - name: Collect updater artifacts
        if: steps.check.outputs.enabled == 'true' && matrix.platform_group != 'linux'
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p updater-artifacts
          shopt -s nullglob
          # macOS updater bundle (.app.tar.gz + .sig)
          for f in "$TARGET_DIR"/macos/*.tar.gz; do
            cp "$f" updater-artifacts/
            cp "$f.sig" updater-artifacts/
          done
          # Windows updater bundle (the NSIS installer + .sig)
          for f in "$TARGET_DIR"/nsis/*-setup.exe; do
            cp "$f" updater-artifacts/
            cp "$f.sig" updater-artifacts/
          done
          shopt -u nullglob
          echo "=== updater artifacts ==="
          ls -la updater-artifacts/

      - name: Upload updater artifacts
        if: steps.check.outputs.enabled == 'true' && matrix.platform_group != 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-ide-${{ matrix.platform_key }}-updater
          path: updater-artifacts/
          retention-days: 7

  # ── Draft release: assets + manifests, nothing public ──────────────
  draft:
    needs: [config, build]
    if: needs.config.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.config.outputs.version }}
      TAG: ${{ needs.config.outputs.tag }}
      SHA: ${{ needs.config.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: Assemble release files
        run: |
          set -euo pipefail
          mkdir -p release-files
          echo "=== Downloaded artifacts ==="
          find artifacts/ -type f | sort
          # Installers keep their names.
          for dir in artifacts/hermes-ide-*-installer; do
            [ -d "$dir" ] && cp "$dir"/* release-files/
          done
          # Updater bundles get the platform key as a prefix: the macOS archive
          # has the same file name on both architectures.
          for dir in artifacts/hermes-ide-*-updater; do
            [ -d "$dir" ] || continue
            KEY=$(basename "$dir" | sed 's/^hermes-ide-//; s/-updater$//')
            for f in "$dir"/*; do cp "$f" "release-files/${KEY}-$(basename "$f")"; done
          done
          echo "=== Release files ==="
          ls -la release-files/

      - name: Build manifests
        run: |
          set -euo pipefail
          node scripts/ci/release-manifests.mjs build release-files \
            --tag "$TAG" --repo "${{ github.repository }}" \
            --notes "Hermes IDE $VERSION — https://github.com/${{ github.repository }}/releases/tag/$TAG"
          (cd release-files && sha256sum -- * > SHA256SUMS.txt)
          echo "=== latest.json ==="; cat release-files/latest.json
          echo "=== downloads.json ==="; cat release-files/downloads.json

      - name: Lint manifests
        run: |
          node scripts/ci/release-manifests.mjs lint release-files \
            --tag "$TAG" --expect "${{ needs.config.outputs.expect_keys }}"

      # Prepared for a person to submit to microsoft/winget-pkgs (a one-time
      # CLA); never submitted from here. The `winget` job below installs the
      # published release through them.
      # Informational: a problem here never holds a release back.
      - name: winget manifests
        if: needs.config.outputs.build_windows == 'true'
        continue-on-error: true
        run: |
          node scripts/ci/winget-manifests.mjs release-files \
            --tag "$TAG" --repo "${{ github.repository }}" --out winget --version "$VERSION"
          find winget -type f -print -exec cat {} \;

      - name: Upload winget manifests
        if: needs.config.outputs.build_windows == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: winget-manifests
          path: winget/
          retention-days: 30

      - name: Prepare release notes
        run: |
          set -euo pipefail
          {
            cat RELEASE_NOTES.md
            printf '\n\n---\n%s\n' "$SOAK_NOTE"
            printf 'Full changelog: https://hermes-ide.com/changelog\n'
          } > release-notes.txt

      - name: Create draft release
        run: |
          set -euo pipefail
          EXISTING=$(gh release view "$TAG" --json isDraft,targetCommitish 2>/dev/null || true)
          if [[ -n "$EXISTING" ]]; then
            IS_DRAFT=$(jq -r '.isDraft' <<<"$EXISTING")
            TARGET=$(jq -r '.targetCommitish' <<<"$EXISTING")
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "::error::$TAG is already published — a release is never rebuilt in place"; exit 1
            fi
            # A draft is only reused by a re-run of the SAME commit. A draft
            # from another commit is never touched: uploading over it would
            # mix two builds under one tag. `config` already refused such a
            # draft an hour ago; this catches one made since.
            if [[ "$TARGET" != "$SHA" ]]; then
              echo "::error::draft $TAG targets $TARGET but this run built $SHA — another train owns that draft; it is never reused or overwritten"; exit 1
            fi
            echo "Draft $TAG already exists for $SHA (re-run) — reusing it"
          else
            # The API occasionally answers a create with a transient 403.
            for attempt in 1 2 3; do
              if gh release create "$TAG" --draft --target "$SHA" \
                   --title "Hermes IDE $TAG" --notes-file release-notes.txt; then
                break
              fi
              [ "$attempt" -eq 3 ] && { echo "::error::could not create the draft release"; exit 1; }
              echo "create failed (attempt $attempt) — retrying in 20 s"; sleep 20
            done
            sleep 5
          fi

      - name: Upload assets to the draft
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=( release-files/* )
          for attempt in 1 2 3; do
            echo "Upload attempt $attempt of 3..."
            if gh release upload "$TAG" --clobber "${FILES[@]}"; then
              echo "Upload succeeded"; exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 15
          done
          echo "::error::All upload attempts failed"; exit 1

      - name: Upload release files (for the publish step)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-manifests
          path: |
            release-files/latest.json
            release-files/downloads.json
            release-files/SHA256SUMS.txt
          retention-days: 7

  # ── Install every artifact on its platform and run the self-test ───
  smoke:
    needs: [config, draft]
    if: needs.config.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: darwin-aarch64,  os: macos-15,          kind: dmg,  group: macos }
          - { key: darwin-x86_64,   os: macos-15-intel,    kind: dmg,  group: macos }
          - { key: linux-x86_64,    os: ubuntu-24.04,      kind: deb,  group: linux }
          - { key: linux-aarch64,   os: ubuntu-24.04-arm,  kind: deb,  group: linux }
          - { key: linux-x86_64,    os: ubuntu-24.04,      kind: appimage, group: linux }
          - { key: linux-aarch64,   os: ubuntu-24.04-arm,  kind: appimage, group: linux }
          - { key: windows-x86_64,  os: windows-2022,      kind: nsis, group: windows }
          - { key: windows-aarch64, os: windows-11-arm,    kind: nsis, group: windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      HERMES_DISABLE_UPDATE_CHECK: "1"
    steps:
      - name: Check if this platform is enabled
        id: check
        shell: bash
        run: |
          case "${{ matrix.group }}" in
            macos)   E="${{ needs.config.outputs.build_macos }}" ;;
            linux)   E="${{ needs.config.outputs.build_linux }}" ;;
            windows) E="${{ needs.config.outputs.build_windows }}" ;;
          esac
          echo "enabled=$E" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: steps.check.outputs.enabled == 'true'
        with:
          name: hermes-ide-${{ matrix.key }}-installer
          path: dl

      - name: Install and self-test (macOS)
        if: steps.check.outputs.enabled == 'true' && matrix.kind == 'dmg'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          DMG=$(ls dl/*.dmg | head -1)
          echo "Installing $DMG"
          MOUNT="$RUNNER_TEMP/hermes-dmg"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          APPS="$RUNNER_TEMP/Applications"; mkdir -p "$APPS"
          cp -R "$MOUNT"/*.app "$APPS/"
          hdiutil detach "$MOUNT"
          APP=$(ls -d "$APPS"/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            spctl --assess --type execute -vv "$APP"
            xcrun stapler validate "$DMG"
          else
            echo "::warning::unsigned build — Gatekeeper assessment skipped"
          fi
          test -x "$APP/Contents/MacOS/hermes-pty-setup"
          "$APP/Contents/MacOS/hermes-ide" --self-test="$RUNNER_TEMP/self-test.json"

      - name: Install and self-test (Linux)
        if: steps.check.outputs.enabled == 'true' && matrix.kind == 'deb'
        env:
          # Runners have no GPU; keep WebKitGTK on the software path.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          set -euo pipefail
          DEB=$(ls dl/*.deb | head -1)
          echo "Installing $DEB"
          sudo apt-get update
          sudo apt-get install -y "./$DEB" xvfb dbus-x11
          which hermes-ide
          xvfb-run -a dbus-run-session -- hermes-ide --self-test="$RUNNER_TEMP/self-test.json"

      - name: Install and self-test (Linux AppImage)
        if: steps.check.outputs.enabled == 'true' && matrix.kind == 'appimage'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          set -euo pipefail
          APPIMAGE=$(ls dl/*.AppImage | head -1)
          echo "Installing $APPIMAGE"
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64
          # An AppImage leaves the graphics and font stack (libEGL, libGL,
          # libgbm, libdrm, fontconfig, freetype, harfbuzz) to the system, as
          # every desktop has it (linuxdeploy's excludelist); a runner does not.
          sudo apt-get install -y libegl1 libgl1 libgbm1 libdrm2 libfontconfig1 libfreetype6 libharfbuzz0b
          # What a person does: put it somewhere and make it executable.
          mkdir -p "$HOME/Applications"
          cp "$APPIMAGE" "$HOME/Applications/"
          INSTALLED="$HOME/Applications/$(basename "$APPIMAGE")"
          chmod +x "$INSTALLED"
          # Name any library the system still lacks, so a failure below says
          # which one instead of stopping at the first.
          (cd "$RUNNER_TEMP" && "$INSTALLED" --appimage-extract >/dev/null)
          ROOT="$RUNNER_TEMP/squashfs-root"
          LIBS=$(find "$ROOT" -name '*.so*' -type f -printf '%h\n' | sort -u | paste -sd:)
          MISSING=$(find "$ROOT/usr/bin" "$ROOT/usr/lib" -type f \( -perm -u+x -o -name '*.so*' \) | while read -r f; do
            file -b "$f" | grep -q ELF || continue
            LD_LIBRARY_PATH="$LIBS" ldd "$f" 2>/dev/null | grep "not found" || true
          done | sort -u || true)
          if [ -n "$MISSING" ]; then echo "::warning::libraries the system lacks:"; echo "$MISSING"; fi
          rm -rf "$ROOT"
          xvfb-run -a dbus-run-session -- "$INSTALLED" --self-test="$RUNNER_TEMP/self-test.json"

      - name: Install and self-test (Windows)
        if: steps.check.outputs.enabled == 'true' && matrix.kind == 'nsis'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem dl -Filter *-setup.exe | Select-Object -First 1
          Write-Host "Installing $($installer.FullName)"
          $p = Start-Process $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $candidates = @("$env:LOCALAPPDATA\HERMES-IDE\hermes-ide.exe", "$env:ProgramFiles\HERMES-IDE\hermes-ide.exe")
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "hermes-ide.exe not found after install (looked in: $($candidates -join ', '))" }
          Write-Host "Installed at $exe"
          $report = Join-Path $env:RUNNER_TEMP "self-test.json"
          # Start-Process -Wait would also wait for every descendant (a shell
          # left behind by a failed PTY check); wait for the app alone, bounded.
          $startedAt = Get-Date
          $app = Start-Process $exe -ArgumentList "--self-test=$report" -PassThru
          if (-not $app.WaitForExit(240000)) {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            throw "the app did not exit within 240 s"
          }
          Get-Process -Name pwsh, powershell, cmd -ErrorAction SilentlyContinue | Where-Object { $_.StartTime -gt $startedAt } | Stop-Process -Force -ErrorAction SilentlyContinue
          if (Test-Path $report) { Get-Content $report }
          if ($app.ExitCode -ne 0) { throw "self-test exited with $($app.ExitCode)" }

      - name: Show report
        if: always() && steps.check.outputs.enabled == 'true'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/self-test.json" ]; then
            cat "$RUNNER_TEMP/self-test.json"
            node -e 'const r=require(process.argv[1]); if(!r.ok){console.error("self-test FAILED"); process.exit(1)}' "$RUNNER_TEMP/self-test.json"
          else
            echo "::error::no self-test report was written"; exit 1
          fi

      - name: Upload self-test report
        if: always() && steps.check.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: self-test-${{ matrix.key }}-${{ matrix.kind }}
          path: ${{ runner.temp }}/self-test.json
          if-no-files-found: ignore
          retention-days: 30

  # ── SLSA provenance for the installers ─────────────────────────────
  provenance:
    needs: [config, build]
    if: needs.config.outputs.release == 'true' && needs.config.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: hermes-ide-*-installer
          path: provenance-files/

      - name: Collect binary files for attestation
        run: |
          mkdir -p attest-files
          find provenance-files/ -type f ! -name '*.sig' -exec cp {} attest-files/ \;
          ls -la attest-files/

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'attest-files/*'

  # ── Tag the merged commit and publish to the beta channel ──────────
  publish-beta:
    needs: [config, draft, smoke, provenance]
    if: needs.config.outputs.release == 'true' && needs.config.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    concurrency:
      group: channels-branch
      cancel-in-progress: false
    env:
      TAG: ${{ needs.config.outputs.tag }}
      SHA: ${{ needs.config.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      - name: Create the tag on the merged commit (never moved)
        run: |
          set -euo pipefail
          # Looked up with git, as `config` does. `gh api` prints the JSON
          # error body on stdout for a tag that does not exist (404), so an
          # `|| true` capture of it reads as "the tag points somewhere else"
          # and the never-move guard refuses to create it.
          EXISTING=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$EXISTING" ]; then
            if [ "$EXISTING" != "$SHA" ]; then
              echo "::error::tag $TAG already points at $EXISTING, not $SHA — tags are never moved"; exit 1
            fi
            echo "Tag $TAG already points at $SHA"
          else
            gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
            echo "Created tag $TAG at $SHA"
          fi

      - name: Publish as prerelease (beta channel)
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --prerelease --latest=false
          gh release view "$TAG" --json isDraft,isPrerelease,tagName,targetCommitish

      - name: Download manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-manifests
          path: manifests

      - name: Point the beta channel at this release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin channels 2>/dev/null; then
            git worktree add channels-wt origin/channels
          else
            git worktree add --detach channels-wt
            (cd channels-wt && git checkout --orphan channels && git rm -rfq . && printf '# Update channels\n\nWritten by the release workflow. Do not edit by hand.\n' > README.md)
          fi
          cp manifests/latest.json channels-wt/beta.json
          cd channels-wt
          git add -A
          git commit -m "beta: $TAG" || echo "beta.json unchanged"
          git push origin HEAD:channels
          echo "Beta clients now read $TAG from channels/beta.json"

  # ── winget installs the published release ──────────────────────────
  # Installs the release just published through the winget manifests the
  # draft step generated (same generator, same installer) and checks that
  # winget lists it.
  # Informational: the release is already out when this runs.
  winget:
    needs: [config, publish-beta]
    if: needs.config.outputs.dry_run == 'false' && needs.config.outputs.build_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - name: Make sure winget is available
        shell: pwsh
        run: ./scripts/ci/ensure-winget.ps1
      # Unsigned installers: Windows checks them before they start and
      # nobody can answer on a runner (see ci.yml, e2e-installers).
      - name: Let unsigned installers start on the runner
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\System" /v EnableSmartScreen /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer" /v SmartScreenEnabled /t REG_SZ /d Off /f
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Associations" /v LowRiskFileTypes /t REG_SZ /d ".exe;.msi" /f
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings\Zones\3" /v 1806 /t REG_DWORD /d 0 /f
          echo "SEE_MASK_NOZONECHECKS=1" >> $env:GITHUB_ENV
      - name: winget install --manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HERMES_E2E_RELEASE_TAG: ${{ needs.config.outputs.tag }}
          HERMES_E2E_EVIDENCE: ${{ runner.temp }}/winget-evidence
        run: node e2e/app/scenarios/F25-winget-install.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: winget-install-evidence
          path: ${{ runner.temp }}/winget-evidence
          if-no-files-found: warn
          retention-days: 30

  # ── Dry runs leave nothing behind ──────────────────────────────────
  dry-run-cleanup:
    needs: [config, draft, smoke]
    if: always() && needs.config.outputs.dry_run == 'true' && needs.draft.result != 'skipped'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.config.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete the draft release
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft -q '.isDraft' -R "${{ github.repository }}" 2>/dev/null | grep -q true; then
            gh release delete "$TAG" --yes -R "${{ github.repository }}"
            echo "Deleted draft $TAG"
          else
            echo "No draft named $TAG to delete"
          fi
          if git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::dry run must not create a tag, but $TAG exists"; exit 1
          fi
          echo "Smoke result: ${{ needs.smoke.result }}"
