name: E2E

# Drives the REAL app on every desktop OS: builds the test build (the app plus
# its test-only automation bridge), runs the scenarios under e2e/app/scenarios
# hands-free, uploads the evidence (logs, screenshots, results), and finally
# checks the acceptance ledger (e2e/acceptance.yml) against the results of all
# three runners. See e2e/app/harness.mjs for how the app is driven.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "e2e/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/e2e.yml"
  merge_group:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "e2e/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
    inputs:
      repeat:
        description: "How many times to run terminal-echo on each OS"
        required: false
        default: "20"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Pull requests get a quick pass; main, the merge queue and manual runs get
  # the full "20 in a row" the acceptance criteria ask for.
  REPEAT: ${{ github.event_name == 'workflow_dispatch' && inputs.repeat || (github.event_name == 'pull_request' && '5' || '20') }}

jobs:
  scenarios:
    name: Real app on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: windows-2022
            name: windows
          - os: macos-15
            name: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      # Where the test app and the evidence go on this runner.
      - name: Choose the output folder
        shell: bash
        run: echo "HERMES_E2E_OUT=$RUNNER_TEMP/hermes-e2e" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm

      - name: Cache apt packages (Linux)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
          version: 1.0

      # The cache action ignores apt failures and can restore an empty cache.
      - name: Ensure system libraries are installed (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! pkg-config --exists glib-2.0 gtk+-3.0 webkit2gtk-4.1 libsoup-3.0 javascriptcoregtk-4.1 || ! command -v xvfb-run >/dev/null; then
            echo "apt cache incomplete, installing packages directly"
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
          fi

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri
          shared-key: e2e-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Build the test app
        shell: bash
        run: node e2e/app/build.mjs

      - name: Run scenarios (Linux, virtual display)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CI: "true"
          # WebKitGTK on a runner without a GPU: draw on the CPU.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            set -e
            node e2e/app/run.mjs --repeat "$REPEAT" terminal-echo.mjs
            node e2e/app/run.mjs --keep-going N01-bridge-safety.mjs N01-acceptance-gate.mjs N01-release-refuses-e2e.mjs
          '

      - name: Run scenarios
        if: runner.os != 'Linux'
        shell: bash
        env:
          CI: "true"
        run: |
          node e2e/app/run.mjs --repeat "$REPEAT" terminal-echo.mjs
          node e2e/app/run.mjs --keep-going N01-bridge-safety.mjs N01-acceptance-gate.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-evidence-${{ matrix.name }}
          path: ${{ runner.temp }}/hermes-e2e/evidence
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    name: Acceptance gate
    needs: scenarios
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      - name: Download the evidence of every runner
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: e2e-evidence-*
          path: ${{ runner.temp }}/evidence

      - name: Every shipped feature has a green scenario on every OS
        run: node e2e/acceptance-check.mjs --results "${{ runner.temp }}/evidence"
