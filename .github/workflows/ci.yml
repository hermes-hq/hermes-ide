name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/RELEASE_TEMPLATE.md"
      - ".github/dependabot.yml"
      - ".github/FUNDING.yml"
      - "SPONSORS.md"
      - "scripts/release-*.sh"
      - "scripts/generate-changelog.sh"
  # No paths-ignore on pull_request / merge_group: the required `gate` check
  # must always report, or a docs-only PR would wait on it forever. The
  # `changes` job decides which jobs run; the gate knows which may be skipped.
  pull_request:
    branches: [main]
  merge_group:
  # Nightly: every job on main, including the real key presses of F05.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      repeat:
        description: "How many times to run terminal-echo on each OS"
        required: false
        default: "20"

# Superseded PR pushes are cancelled. Runs on main and in the merge queue are
# never cancelled: each of those commits must finish its checks.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Real-app scenarios: every run — pull requests included — gets the full
  # "20 in a row" the acceptance criteria ask for, so a flaky change is caught
  # before it reaches main. A manual run can choose another count.
  REPEAT: ${{ github.event_name == 'workflow_dispatch' && inputs.repeat || '20' }}

jobs:
  # ── Detect what changed to skip irrelevant jobs ──────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    # Only pull requests are filtered by path. Pushes to main and merge-queue
    # commits run every job.
    outputs:
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      ci: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ci == 'true' }}
      workflows: ${{ github.event_name != 'pull_request' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'patches/**'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'index.html'
              - 'eslint.config.js'
              - 'eslint-rules/**'
              - 'knip.json'
              # Scripts whose unit tests live in src/__tests__
              - 'scripts/privacy-check.mjs'
              - 'scripts/mutation-score.mjs'
              - '.github/privacy-allowlist.json'
              - 'bundle-budget.json'
              - 'scripts/bundle-budget.mjs'
              - 'scripts/generate-shortcuts.mjs'
              - 'scripts/check-readme-claims.mjs'
              - 'docs/readme-claims.yml'
            rust:
              - 'src-tauri/**'
              - 'rust-toolchain.toml'
              - 'package.json'
              - 'package-lock.json'
            ci:
              - '.github/workflows/ci.yml'
              - 'scripts/ci-gate.mjs'
              - 'scripts/stage-bridge-deps.mjs'
              - 'e2e/**'
            workflows:
              - '.github/workflows/**'

  # ── Dev and test builds never run as the installed app ───────────────
  instance-identifiers:
    name: Instance Identifiers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - name: Dev and e2e configs never use the production identifier
        run: node scripts/check-instance-identifiers.mjs

  # ── Workflow files: syntax, expressions, action inputs ───────────────
  # Shell snippets are not linted (shellcheck off): this job is about the
  # workflow files themselves, so an edit to any of them is checked.
  actionlint:
    name: Workflow Lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
      - name: Lint every workflow
        run: '"$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes='

  # ── Frontend: TypeScript + Tests (merged into one job) ───────────────
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      # Unused files, exports and dependencies (config: knip.json).
      - name: Unused code (knip)
        run: npx knip
      - name: Unit tests
        run: npx vitest run
      # Fails when the JavaScript the window must load before it can draw
      # grows past bundle-budget.json. New views and heavy libraries belong
      # behind React.lazy / import() so they load when first used.
      - name: Build the frontend
        run: npx vite build
      - name: Startup JS budget
        run: node scripts/bundle-budget.mjs

  # ── Rust Formatting ──────────────────────────────────────────────────
  rust-fmt:
    name: Rust Formatting
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cd src-tauri && cargo fmt --check

  # ── Rust Clippy ──────────────────────────────────────────────────────
  rust-clippy:
    name: Rust Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0
      # The cache action ignores apt failures (e.g. mirror 404s) and can
      # save/restore an empty cache, leaving clippy without glib/gtk.
      - name: Ensure system libraries are installed
        run: |
          if ! pkg-config --exists glib-2.0 gtk+-3.0 webkit2gtk-4.1 libsoup-3.0 javascriptcoregtk-4.1; then
            echo "apt cache incomplete, installing packages directly"
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri
          shared-key: ci-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Stages bridge runtime deps via the postinstall hook so the Tauri
      # build script doesn't fail when clippy compiles the crate.
      - name: Install npm deps + stage bridge runtime
        run: npm ci
      - name: Run clippy
        run: cd src-tauri && cargo clippy --locked --all-targets -- -D warnings

  # ── Rust Tests (all three OSes) ──────────────────────────────────────
  rust-test:
    name: Rust Tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0
      - name: Ensure system libraries are installed
        if: runner.os == 'Linux'
        run: |
          if ! pkg-config --exists glib-2.0 gtk+-3.0 webkit2gtk-4.1 libsoup-3.0 javascriptcoregtk-4.1; then
            echo "apt cache incomplete, installing packages directly"
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri
          shared-key: ci-test-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Stages bridge runtime deps; the Tauri build script checks them.
      - name: Install npm deps + stage bridge runtime
        run: npm ci
      - name: Build PTY helper (needed by tests on macOS)
        if: runner.os == 'macOS'
        working-directory: src-tauri/pty-setup
        run: cargo build --target-dir ../target
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  # ── Real-app scenarios (all three OSes) ──────────────────────────────
  # Builds the test app (the app plus its test-only automation bridge),
  # runs the scenarios under e2e/app/scenarios hands-free through
  # e2e/app/run.mjs (which skips scenarios the ledger limits to other
  # platforms), and uploads the evidence. See e2e/app/harness.mjs.
  e2e-app:
    name: Real app on ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: windows-2022
            name: windows
          - os: macos-15
            name: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      # Where the test app and the evidence go on this runner.
      - name: Choose the output folder
        shell: bash
        run: echo "HERMES_E2E_OUT=$RUNNER_TEMP/hermes-e2e" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm

      - name: Cache apt packages (Linux)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb xdotool
          version: 1.0

      # The cache action ignores apt failures and can restore an empty cache.
      - name: Ensure system libraries are installed (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! pkg-config --exists glib-2.0 gtk+-3.0 webkit2gtk-4.1 libsoup-3.0 javascriptcoregtk-4.1 || ! command -v xvfb-run >/dev/null || ! command -v xdotool >/dev/null; then
            echo "apt cache incomplete, installing packages directly"
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb xdotool
          fi

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri
          shared-key: e2e-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Build the test app
        shell: bash
        run: node e2e/app/build.mjs

      - name: Run scenarios (Linux, virtual display)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CI: "true"
          # WebKitGTK on a runner without a GPU: draw on the CPU.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          # No accessibility bus on a bare runner: do not look for one.
          NO_AT_BRIDGE: "1"
          GTK_A11Y: "none"
        run: |
          # The toolchain step turns cargo colours on for the job; scenarios
          # that read cargo's messages need them plain.
          export CARGO_TERM_COLOR=never
          # Every batch runs even when an earlier one failed, so one red
          # scenario never leaves later ones without a result; the step
          # still fails at the end if any batch did.
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            fail=0
            node e2e/app/run.mjs --repeat "$REPEAT" terminal-echo.mjs || fail=1
            node e2e/app/run.mjs --keep-going N02-instance-isolation.mjs N06-db-migrations.mjs N07-feature-flags.mjs SEC-plugin-identity-two-plugins.mjs N14-disk-guard.mjs F07-agent-view-respawn.mjs F03-retire-autopilot.mjs F03-foreground-check-lock.mjs F06-custom-agent.mjs N03-fake-agent.mjs N05-self-test.mjs N05-update-channel.mjs F04-private-by-default.mjs F02-crash-containment.mjs N10-update-waits-for-idle.mjs || fail=1
            node e2e/app/run.mjs F13-approval-safety.mjs || fail=1
            node e2e/app/run.mjs --keep-going N01-bridge-safety.mjs N01-acceptance-gate.mjs N01-screenshot-covered-window.mjs N01-release-refuses-e2e.mjs || fail=1
            node e2e/app/run.mjs --keep-going F09-honest-isolation.mjs N23-shortcuts-panel.mjs N23-docs-gates.mjs || fail=1
            node e2e/app/run.mjs --keep-going N09-terminal-first.mjs || fail=1
            exit "$fail"
          '

      - name: Run scenarios
        if: runner.os != 'Linux'
        shell: bash
        env:
          CI: "true"
        run: |
          export CARGO_TERM_COLOR=never
          # Every batch runs even when an earlier one failed (see above).
          fail=0
          node e2e/app/run.mjs --repeat "$REPEAT" terminal-echo.mjs || fail=1
          node e2e/app/run.mjs --keep-going N02-instance-isolation.mjs N06-db-migrations.mjs N07-feature-flags.mjs SEC-plugin-identity-two-plugins.mjs N14-disk-guard.mjs F07-agent-view-respawn.mjs F03-retire-autopilot.mjs F03-foreground-check-lock.mjs F06-custom-agent.mjs N03-fake-agent.mjs N05-self-test.mjs N05-update-channel.mjs F04-private-by-default.mjs F02-crash-containment.mjs N10-update-waits-for-idle.mjs || fail=1
          node e2e/app/run.mjs F13-approval-safety.mjs || fail=1
          node e2e/app/run.mjs --keep-going N01-bridge-safety.mjs N01-acceptance-gate.mjs N01-screenshot-covered-window.mjs || fail=1
          node e2e/app/run.mjs --keep-going F09-honest-isolation.mjs N23-shortcuts-panel.mjs N23-docs-gates.mjs || fail=1
          node e2e/app/run.mjs --keep-going N09-terminal-first.mjs || fail=1
          exit "$fail"

      # F05: a focused terminal keeps Ctrl+letter. Real OS key presses
      # (xdotool / SendInput) go through the native menu and the webview.
      - name: Terminal keys with real key presses (Linux, virtual display)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        env:
          CI: "true"
          HERMES_E2E_OS_KEYS: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          export CARGO_TERM_COLOR=never
          xvfb-run -a -s "-screen 0 1600x1000x24" node e2e/app/run.mjs F05-terminal-keys.mjs

      - name: Terminal keys with real key presses (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        env:
          CI: "true"
          HERMES_E2E_OS_KEYS: "1"
        run: node e2e/app/run.mjs F05-terminal-keys.mjs

      - name: Terminal keys (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        shell: bash
        env:
          CI: "true"
        run: node e2e/app/run.mjs F05-terminal-keys.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-evidence-${{ matrix.name }}
          path: ${{ runner.temp }}/hermes-e2e/evidence
          if-no-files-found: warn
          retention-days: 14

  # ── Acceptance ledger ────────────────────────────────────────────────
  # Every feature marked shipped in e2e/acceptance.yml needs a green
  # scenario on every OS it must run on. Runs even when a scenario runner
  # failed, so the report says which feature lost its proof.
  acceptance:
    name: Acceptance gate
    needs: [changes, e2e-app]
    if: >-
      always()
      && needs.changes.result == 'success'
      && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      - name: Download the evidence of every runner
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: e2e-evidence-*
          path: ${{ runner.temp }}/evidence

      - name: Every shipped feature has a green scenario on every OS
        run: node e2e/acceptance-check.mjs --results "${{ runner.temp }}/evidence"

  # ── Privacy: this repository is public ───────────────────────────────
  # Runs on every change. Fails on secrets (gitleaks over the new commits)
  # and on added personal home paths, non-synthetic email addresses, or new
  # binary/data files outside the asset directories
  # (scripts/privacy-check.mjs, allowlist in .github/privacy-allowlist.json).
  privacy:
    name: Privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - name: Work out which commits to check
        id: range
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group)  base="$MQ_BASE" ;;
            *)            base="$PUSH_BEFORE" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::warning::base commit '$base' is not available; checking only the last commit"
            base="$(git rev-parse HEAD~1)"
          fi
          echo "Checking $base..$(git rev-parse HEAD)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Secrets in the new commits (gitleaks)
        env:
          BASE: ${{ steps.range.outputs.base }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --log-opts="$BASE..HEAD" --redact --no-banner --exit-code 1 .
      - name: Personal paths, email addresses and data files
        env:
          BASE: ${{ steps.range.outputs.base }}
        run: node scripts/privacy-check.mjs --base "$BASE"

  # ── Gate: the one required check ─────────────────────────────────────
  # Always runs. Fails when any job it needs failed, was cancelled, or was
  # skipped although its inputs changed. Make only this check required.
  gate:
    name: gate
    if: always()
    needs: [changes, frontend, rust-fmt, rust-clippy, rust-test, e2e-app, acceptance, privacy, instance-identifiers, actionlint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci-gate.mjs
            .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
      - name: Every job is gated, with the skip rules the gate expects
        run: node scripts/ci-gate.mjs --workflow .github/workflows/ci.yml
      - name: Check every required job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs

  # ── Rust Security Audit (main only) ─────────────────────────────────
  # Not in the gate (see UNGATED in scripts/ci-gate.mjs): it runs after merge,
  # and a newly published advisory must not block unrelated pull requests.
  rust-audit:
    name: Rust Security Audit
    needs: changes
    # Only on main pushes + only when Rust deps changed
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Cache cargo-audit binary
        id: cache-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit
      - name: Run security audit
        run: cd src-tauri && cargo audit
