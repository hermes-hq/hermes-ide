  F15:
    name: "⌘N task launcher"
    # partial: the Agent view path (the task as the first message of a
    # Claude Agent view session) is covered by unit tests only, and the empty
    # state opens the launcher through its tile rather than showing it inline.
    # On Windows the scenario needs the fake agents on the registry Path, so
    # it runs there on CI runners only.
    status: partial
    criteria:
      F15-1:
        text: "Typing a task and pressing Enter starts the agent in a terminal on a new hermes/<slug> worktree with the task as its first prompt"
        scenarios: [F15-task-launcher.mjs]
      F15-2:
        text: "A signed-out agent disables Launch and offers Sign in"
        scenarios: [F15-task-launcher.mjs]
      F15-3:
        text: "The advanced creator opens with its own shortcut and still offers SSH"
        scenarios: [F15-task-launcher.mjs]
      F15-4:
        text: "An existing branch, a folder that is not a git repository and low disk each block Launch with their own row"
        scenarios: [F15-task-launcher.mjs]
      F15-5:
        # Launcher v2 (the approved 2.0 mock). Model and effort flags come
        # from the capability backend when the build has it; the scenarios
        # prove the arguments the fake agent was started with.
        text: "Every chip reaches the agent it starts: agent and account (the Custom agent listed), project, where (a new worktree from a chosen base, an existing branch, the current checkout), the agent's real approval modes (Skip all in red with its note), model, and effort (off for a model without levels)"
        scenarios: [F15-launcher-chips.mjs]
      F15-6:
        text: "+ options reach the agent: extra args, the prefix from Settings (shown), channels, edited checks, Track as a feature instead of a size, and Also on with its own agent, approval, model and effort; \"Hermes will run\" shows the command lines"
        scenarios: [F15-launcher-chips.mjs]
      F15-7:
        text: "Launch & next keeps the sheet with the same choice; a click outside keeps the draft; Recent comes from the launches; projects are listed most used first; with the running-agents cap reached a task waits and starts when a slot frees"
        scenarios: [F15-launcher-flow.mjs]
      F15-8:
        # F15-launcher-tab presses real keys (Tab, Return, Escape) and so runs
        # only where CI can: Linux (Xvfb) and Windows runners.
        text: "Keyboard only, from a cold start with no session: four tasks launched in under 60 seconds; with real key presses, Tab from the task field reaches the chips and Shift+Tab comes back"
        scenarios:
          - F15-launcher-keyboard.mjs
          - F15-launcher-tab.mjs@linux,win32
      F15-9:
        text: "The launcher opens pre-set to the usual full combination; after 3 identical launches it asks once to save a preset, and never again for that combination, even when the question was left unanswered; the preset chip and ⌘1–⌘4 apply presets and keep the task; a preset with unavailable parts (a model, effort or mode the agent lacks, a base branch the repository lacks) warns and launches the fallback, never the stale choice; Settings > Agents lists the presets (stale ones marked) and renames and deletes them"
        scenarios: [F15-launcher-presets.mjs]
  F16:
    name: "Three-step onboarding and agent doctor"
    # partial: the doctor's sign-in check is exactly what the catalog says
    # (auth.check); agents without one show "Unknown". Real vendor CLIs are
    # never run in tests: fake CLIs answer --version and the sign-in check.
    status: partial
    criteria:
      F16-1:
        text: "A fresh install reaches a running first task in 3 screens"
        scenarios: [F16-onboarding-doctor.mjs]
      F16-2:
        text: "With no agents installed, Continue stays enabled and ⌘T opens a shell"
        scenarios: [F16-onboarding-doctor.mjs]
      F16-3:
        text: "The doctor shows the version and auth state for Claude, Codex and OpenCode when installed"
        scenarios: [F16-onboarding-doctor.mjs]
      F16-4:
        text: "The usage stats line reads 'off'"
        scenarios: [F16-onboarding-doctor.mjs]
  N19:
    name: "Rate limits and handoff"
    # partial: only Claude reports its limit today (StopFailure rate_limit,
    # the quota notifications and the status line's rate_limits); other
    # agents are never shown as limited, which is honest but not "limited".
    # The reset time comes from the status line Hermes sets per launch, so a
    # user with a status line of their own sees "limited" without a reset
    # time. Behind the launchHelper flag: the task travels as a launch
    # argument through hi, so only agents that take a first prompt are
    # offered.
    status: partial
    criteria:
      N19-1:
        text: "A rate-limited Claude session shows \"limited\" with the reset time"
        scenarios: [N19-limits-and-handoff.mjs]
      N19-2:
        text: "Continue in Codex opens a session that references the task and the changed files"
        scenarios: [N19-limits-and-handoff.mjs]
  F14:
    name: "Real context gauge"
    # The gauge reads the transcript the agent names in its own hook signal,
    # so it needs the launch helper (launchHelper flag); nothing to show
    # without it. The fake claude writes a Claude-shaped transcript.
    status: partial
    criteria:
      F14-1:
        text: "The gauge matches reported input tokens / model limit to within 1 point"
        scenarios: [F14-context-gauge.mjs]
      F14-2:
        text: "A compact_boundary event renders a divider in the transcript"
        scenarios: [F14-context-gauge.mjs]
      F14-3:
        text: "Terminal sessions show no gauge rather than a guess"
        scenarios: [F14-context-gauge.mjs]
  F24:
    name: "Fleet performance: many terminals"
    # Behind the fleetPerf flag. Budgets per OS: e2e/app/fleet-budgets.json.
    # "Only visible terminals hold a WebGL context" is asserted where the web
    # view has WebGL (all three CI runners); without WebGL it checks that no
    # terminal holds one.
    status: partial
    criteria:
      F24-1:
        text: "20 open terminal sessions stay responsive on all three OSes"
        scenarios: [F24-fleet-perf.mjs]
      F24-2:
        text: "Idle and per-agent memory stay within the CI budgets"
        scenarios: [F24-fleet-perf.mjs]
  REAL:
    name: "The real Claude Code, started the way a person starts it"
    # Local only: e2e/app/scenarios/REAL-claude-launch.mjs needs a signed-in
    # `claude` on the machine and costs one tiny turn, so it says SKIP in CI
    # (e2e/app/ci-plan.mjs excludes it from the shards) and this entry asks
    # for no result. Run it by hand before a release; it passed on the
    # maintainer's Mac on 2026-09-29.
    status: planned
    criteria:
      REAL-1:
        text: "New Session with a task starts claude through the launch helper (shell -> hi run -> claude), with the task as its first prompt and the per-launch hooks file passed with --settings"
        scenarios: ["REAL-claude-launch.mjs@darwin,linux"]
      REAL-2:
        text: "The start and the turn's end arrive as exact hook signals; no notice appears while the first session starts"
        scenarios: ["REAL-claude-launch.mjs@darwin,linux"]
      REAL-3:
        text: "None of a parent Claude Code session's environment markers reach the agent; it saves its transcript; ~/.claude/settings.json is byte-identical afterwards"
        scenarios: ["REAL-claude-launch.mjs@darwin,linux"]
      REAL-4:
        # e2e/app/scenarios/REAL-launcher-claude.mjs, local only like the others.
        text: "From ⌘N with a model and an effort chosen on the chips, claude runs as hi run -> claude with exactly one --model and one --effort of those values and the task as its first prompt"
        scenarios: ["REAL-launcher-claude.mjs@darwin,linux"]
  UI:
    name: "One consistent control set (UI kit foundation)"
    # Foundation only: tokens, the base.css reset, the components in
    # src/components/ui and a hidden preview (Settings > Flags > Controls
    # preview); screens move to them in later waves. Not behind a flag: the
    # registry is at its 15-flag cap and the only change a user sees is the
    # global reset (UI font on buttons, one solid focus ring, no press
    # shrink) and the contrast fixes. Keyboard and ARIA of every component
    # are unit-tested (src/__tests__/ui-*.test.tsx); every theme's contrast
    # pairs by scripts/contrast-audit.test.mjs. The focus ring is measured
    # on the preview's copy of the :focus-visible rules, because the test
    # window has no keyboard focus locally (the log says whether the real
    # :focus-visible matched as well). UI-focus-ring checks the ring on
    # today's screens in the real cascade order, and presses Tab for real
    # on the Linux and Windows CI runners.
    status: partial
    criteria:
      UI-1:
        text: "In every theme, buttons are 28/32/36 px, fields, select triggers, icon buttons, segmented controls and tabs 32 (28 small), chips 28, toggles 18, checkboxes 16, badges 18"
        scenarios: [UI-kit.mjs]
      UI-2:
        text: "In every theme the focus ring is a solid 2 px outline 2 px away in --focus-ring at >= 3:1, visible in a screenshot, and a focused field keeps its border"
        scenarios: [UI-kit.mjs]
      UI-3:
        text: "Rendered button, field, badge, segment and navigation colours meet 4.5:1 (text) and 3:1 (field edge) in every theme"
        scenarios: [UI-kit.mjs]
      UI-4:
        text: "A plain button takes the UI font and ink, and no rule shrinks a pressed button"
        scenarios: [UI-kit.mjs]
      UI-5:
        text: "In the real webview the Select opens with the arrow key, type-ahead and Enter pick a value, Esc closes only the list, and the Menu runs the item picked with the keyboard"
        scenarios: [UI-kit.mjs]
      UI-6:
        text: "The empty state shows the running app's version"
        scenarios: [UI-audit-fixes.mjs]
      UI-7:
        text: "The Review Desk of a folder that is not a git repository shows the plain empty state, not git's raw error"
        scenarios: [UI-audit-fixes.mjs]
      UI-8:
        # Real cascade order: each stylesheet's own :focus rules are copied
        # in place, so a more specific or later `outline: none` still wins.
        text: "Every control of the three-step welcome (task launcher included), of every Settings tab, and the model/effort picker rows, New Session prefix chips, notes sheet and composer, role, style, project and command-search fields draws the solid focus ring"
        scenarios: [UI-focus-ring.mjs]
      UI-9:
        text: "With real key presses, Tab in Settings moves focus onto a control, :focus-visible matches and the control draws the solid ring"
        scenarios: ["UI-focus-ring.mjs@linux,win32"]
  CAP:
    name: "Models, effort and accounts for every agent (2.0 launch contract)"
    # The launcher's own chips (model, effort, account, presets row) are
    # track LAUNCH's; these prove the backend, the session and Settings with
    # fake CLIs that answer like the real ones. Negative control of both
    # scenarios: HERMES_E2E_CAP_NEGATIVE=1 (the fakes); of CAP-launch-choice
    # also HERMES_E2E_CAP_NEGATIVE=product (the app's refusal watch off); of
    # CAP-refusal-safety HERMES_E2E_CAP_SAFETY_NEGATIVE=echo|replay|fresh|trust
    # (the app's filters off, a relaunch that starts fresh, or a resume's
    # replay ended by any Enter instead of the prompt hook).
    # CAP-1's "else the choice labelled requested" chip supersedes F08's "no
    # chip when the agent reports no model" (the 2026-09-29 launch contract).
    status: partial
    criteria:
      CAP-1:
        text: "A terminal agent starts with the chosen model and effort; the session's model chip shows the model the agent reports, else the choice labelled requested"
        scenarios: [CAP-launch-choice.mjs]
      CAP-2:
        text: "A model the CLI refuses stops the launch within seconds and nothing runs; the session shows the CLI's own words with Retry with default model and Pick another model; Codex's minute of reconnecting is cut short and the model is marked refused by the account"
        scenarios: [CAP-launch-choice.mjs]
      CAP-3:
        text: "A launch in a signed-out account is refused; Sign in runs the CLI's own sign-in in that account's profile, and Try again runs the agent there"
        scenarios: [CAP-launch-choice.mjs]
      CAP-4:
        text: "Settings > Agents shows each installed agent's accounts (plan, never an e-mail), what can be chosen at launch, exact status and the Verified on a real install badge"
        scenarios: [CAP-agents-settings.mjs]
      CAP-5:
        text: "Add account creates a profile folder only then, and opens a terminal running the CLI's sign-in in it; the account then reads as signed in"
        scenarios: [CAP-agents-settings.mjs]
      CAP-6:
        text: "Presets are listed, renamed and deleted in Settings > Agents; a preset whose model is gone launches the default model and says so"
        scenarios: [CAP-agents-settings.mjs]
      CAP-7:
        text: "The usual combination of a repository is its most frequent recent launch (tie: the most recent), else the global usual, else the catalog default; stored choices are checked on read; Save as preset? comes once after three identical launches"
        scenarios: [CAP-agents-settings.mjs]
      CAP-8:
        text: "Only the CLI's own refusal stops a launch: a task, the person's typing, an agent's answer or a resumed conversation's replay that shows a refusal's words stops nothing, also when the replay follows an Enter that answered the CLI's trust prompt"
        scenarios: [CAP-refusal-safety.mjs]
      CAP-9:
        text: "A refused resume (for example, signed out since the last run) is refused at its first message, and Try again resumes the same conversation"
        scenarios: [CAP-refusal-safety.mjs]
  REAL-CAP:
    name: "Models, effort and accounts with the real Claude Code, Codex and Antigravity"
    # Local only: needs the signed-in CLIs and costs a few tiny turns, so the
    # scenarios say SKIP in CI (e2e/app/ci-plan.mjs excludes them) and this
    # entry asks for no result. They passed on the maintainer's Mac on
    # 2026-09-29 (claude 2.1.284, codex 0.145.0, agy 1.2.13).
    status: planned
    criteria:
      REAL-CAP-1:
        text: "Default model and one explicit model + effort launch run a tiny turn; the account probe says signed in; the person's config is byte-identical afterwards"
        scenarios: ["REAL-models-claude.mjs@darwin,linux", "REAL-models-codex.mjs@darwin,linux", "REAL-models-agy.mjs@darwin,linux"]
      REAL-CAP-2:
        text: "A deliberately invalid model is refused and nothing runs (Claude and Codex: the CLI's own words in the banner; Antigravity, which falls back silently, is refused by Hermes before launch)"
        scenarios: ["REAL-models-claude.mjs@darwin,linux", "REAL-models-codex.mjs@darwin,linux", "REAL-models-agy.mjs@darwin,linux"]
      REAL-CAP-3:
        text: "A second Claude account in a temporary profile folder the test creates reads as signed out"
        scenarios: ["REAL-models-claude.mjs@darwin,linux"]
