# Acceptance ledger: which real-app scenario proves which feature.
#
# `node e2e/acceptance-check.mjs` reads this file. A feature with
# `status: shipped` fails the gate when any of its criteria has no scenario,
# names a scenario file that is not under e2e/app/scenarios/, or — in CI,
# where the results of all runners are checked — has a scenario that is
# missing or red on a platform it must be green on.
#
#   status:     planned  nothing is required yet
#               partial  listed scenarios must exist and be green; gaps allowed
#               shipped  every criterion needs at least one green scenario
#   scenarios:  file names under e2e/app/scenarios/. A scenario must be green
#               on macOS, Windows and Linux unless it names its platforms:
#               "<file>.mjs@linux" or "<file>.mjs@darwin,win32".
#
# Keep it plain: nested maps, "- item" or [a, b] lists, and "#" comments.

features:
  N01:
    name: "Proof rig: tests that drive the real app"
    status: shipped
    criteria:
      N01-1:
        # The nightly CI run runs it 20 times in a row on each OS; pull
        # requests, the merge queue and pushes to main run it once (a manual
        # run can pick the count). "No focus
        # stolen" is asserted on macOS; on Windows and Linux (bare runners
        # where nobody is typing) the focus state is only logged.
        text: "The terminal-echo scenario passes 20 times in a row on macOS, Windows and Linux runners"
        scenarios: [terminal-echo.mjs]
      N01-2:
        text: "A release build with the e2e feature fails to compile; without HERMES_E2E=1 the app opens no socket"
        scenarios: [N01-release-refuses-e2e.mjs@linux, N01-bridge-safety.mjs]
      N01-3:
        text: "Requests without the token are refused; the socket is bound to 127.0.0.1 only"
        scenarios: [N01-bridge-safety.mjs]
      N01-4:
        # The gate runs twice: in CI over the runners' results, and again in
        # the release workflow, which also refuses a commit whose CI gate
        # did not pass.
        text: "A feature marked shipped with no green scenario on all three OSes fails the release gate"
        scenarios: [N01-acceptance-gate.mjs]
      N01-5:
        # On the Linux runner the app started last covers the first; the app
        # raises the window and has it repaint before each capture. The same
        # scenario shows on macOS that a window painted one flat colour is
        # still refused; on Windows and Linux the capture includes the native
        # title and menu bar, so there the unit tests cover that refusal.
        text: "A screenshot shows the window it was asked for even while another test app covers it"
        scenarios: [N01-screenshot-covered-window.mjs]
  N02:
    name: "Hermes instances never clobber each other"
    status: partial
    criteria:
      N02-1:
        # Uses lsof to read which files each build has open, so not on Windows.
        text: "A test build pointed at the installed app's data folder refuses to start; two builds side by side leave each other's and the installed app's files alone"
        scenarios:
          - "N02-instance-isolation.mjs@darwin,linux"
  F03:
    name: "Hermes never types into a terminal on its own"
    status: shipped
    # "knip runs in CI with zero unused exports or files" is enforced by the
    # Frontend job in .github/workflows/ci.yml (npx knip); it is not app
    # behaviour, so no real-app scenario proves it.
    criteria:
      F03-1:
        text: "No code path writes a predicted command into a terminal: no Manual/Assisted/Auto switch, no Autonomous settings, and a 1.4.0 user's Auto mode types nothing"
        # The "types nothing" check is a guard only: the 1.4.0 pipeline never
        # fired in the rig, so it has no failing run against an old build. The
        # proof that nothing can type is that the code is gone (knip in CI
        # fails on anything left unused) plus the unit tests.
        scenarios: [F03-retire-autopilot.mjs]
      F03-2:
        text: "With an agent CLI in the foreground no ghost text or suggestion list renders; at a plain shell prompt they still do"
        scenarios: [F03-retire-autopilot.mjs]
      F03-3:
        text: "A 1.4.0 database migrates and loses only execution_nodes, which its backup keeps"
        scenarios: [F03-retire-autopilot.mjs, N06-db-migrations.mjs]
      F03-4:
        # The test build makes every foreground check take a slow process
        # scan on every OS (on macOS and Linux the terminal usually answers
        # without one), so the scenario sees the Windows path everywhere.
        text: "Typing in a terminal stays responsive while the check for a program in the foreground runs repeatedly"
        scenarios: [F03-foreground-check-lock.mjs]
  N05:
    name: "Safe release train with a beta channel"
    # The train itself (draft, smoke on every OS, beta first, promote later)
    # runs in GitHub Actions and is exercised by its dry run; the two parts
    # that live in the app are proven here.
    status: partial
    criteria:
      N05-1:
        text: "A build whose installed self-test fails on any OS never becomes the latest release"
        scenarios: [N05-self-test.mjs]
      N05-2:
        text: "Beta users get a build at least 24 hours before stable users"
        scenarios: [N05-update-channel.mjs]
      N05-3:
        text: "Re-running a release never moves a tag"
        scenarios: []
      N05-4:
        text: "A release without hand-written notes for its version fails"
        scenarios: []
  N06:
    name: "Upgrades never lose data"
    status: shipped
    criteria:
      N06-1:
        text: "Every captured database opens in the new build with the same row counts"
        scenarios: [N06-db-migrations.mjs]
      N06-2:
        text: "Updating from the previous release keeps sessions, settings, saved hosts and plugins"
        scenarios: [N06-db-migrations.mjs]
      N06-3:
        text: "Opening a database from a newer version shows a clear message and changes nothing"
        scenarios: [N06-db-migrations.mjs]
  SEC-plugin-identity:
    name: "Plugin commands are bound to the calling plugin"
    status: shipped
    criteria:
      SEC-plugin-identity-1:
        text: "A plugin that calls the app directly naming another plugin's id, or trying to grant itself permissions, is refused and leaves no trace"
        scenarios: [SEC-plugin-identity-two-plugins.mjs]
      SEC-plugin-identity-2:
        text: "A well-behaved plugin (storage + network, like the GitHub plugin) keeps working through the plugin API"
        scenarios: [SEC-plugin-identity-two-plugins.mjs]
      SEC-plugin-identity-3:
        text: "A plugin cannot list the installed plugins, read their permissions or code, or fetch a URL through the registry check"
        scenarios: [SEC-plugin-identity-two-plugins.mjs]
  N07:
    name: "Feature flags"
    status: shipped
    criteria:
      N07-1:
        # Since 2.0 every flag is on by default on stable too; a flag only
        # hides its feature when it is switched off (the kill switch).
        text: "A flagged feature is visible on stable and on beta by default"
        scenarios: [N07-feature-flags.mjs]
      N07-2:
        text: "Turning a flag off hides the feature on next launch"
        scenarios: [N07-feature-flags.mjs]
      N07-3:
        text: "A fresh install on the stable channel gets every 2.0 feature (the session host on macOS and Linux only)"
        scenarios: [RELEASE-2.0-defaults.mjs]
  N14:
    name: "Disk guard and worktree hygiene"
    status: partial
    criteria:
      N14-1:
        # The free space is a test-only override (HERMES_E2E_FREE_SPACE_BYTES,
        # e2e builds only); 4.2 GB is refused, 50 GB is allowed.
        text: "Below 10 GB free, creating a task shows the reason and creates nothing"
        scenarios: [N14-disk-guard.mjs]
      N14-2:
        # "Remove build output" frees the space shown (N14-disk-guard). The
        # Land sheet's Archive (F22) removes the whole worktree folder, build
        # output included, and says how much went.
        text: "Archiving a task removes its build output and frees the space shown"
        scenarios: [F22-land-sheet.mjs]
      N14-3:
        text: "Orphaned worktree folders are listed and removable in one action"
        scenarios: [N14-disk-guard.mjs]
  N17:
    name: "Fast worktrees: shared dependencies and ports"
    # Behind the diskGuard flag, with N14. Copy-on-write needs the repo and
    # the app's data on one volume that supports it: APFS on macOS; CI mounts
    # an XFS image on Linux and a ReFS VHD on Windows (HERMES_E2E_COW_DIR).
    status: shipped
    criteria:
      N17-1:
        # N17-fast-worktrees.mjs uses a synthetic install (3,000 packages and
        # a 256 MB blob, to prove the blocks are shared) and holds 10 s on
        # every OS; N17-real-deps.mjs uses this repo's own node_modules (about
        # 35,000 files). Per OS: 10 s on macOS and Linux. On Windows ReFS
        # block-clones only files over 64 KB and copies the rest, so this
        # repo's node_modules takes 8-9 s to clone on a hosted runner; there
        # the criterion is under 20 s AND at least 1.5x faster than a
        # warm-cache install (npm ci, npm's cache already filled, scripts
        # skipped) of the same lockfile, which the scenario times in the same
        # run. Measured on a Windows runner: 9.1 s Create to shell (8.6 s
        # clone) against a 21.4 s warm-cache install, 2.4x. A cold install
        # also downloads every package and is much slower than that baseline.
        text: "A new worktree of this repo has working dependencies in under 10 seconds on macOS and Linux; on Windows in under 20 seconds and at least 1.5x faster than a warm-cache install"
        scenarios: [N17-fast-worktrees.mjs, N17-real-deps.mjs]
      N17-2:
        text: "Two worktrees running dev servers get different ports"
        scenarios: [N17-fast-worktrees.mjs]
  F07:
    name: "Agent view: respawn lock and clear errors"
    status: shipped
    criteria:
      F07-1:
        # Retry is clicked twice at once; the app's own spawn log and the fake
        # bridge's log must each show one new process. The same scenario then
        # turns the lock off (test builds only) and must see two.
        text: "Two concurrent restarts for one session produce exactly one process"
        scenarios: [F07-agent-view-respawn.mjs]
      F07-2:
        text: "A signed-out Claude shows \"signed out\" with a Sign in action"
        scenarios: [F07-agent-view-respawn.mjs]
  F06:
    name: "Agent catalog as data"
    status: partial
    criteria:
      # Not app behaviour, so proven outside this ledger:
      #   "The catalog loads from one file validated by a schema test" and
      #   "No deprecated install command remains":
      #     src/__tests__/agent-catalog.test.ts (vitest) and
      #     src-tauri/src/agent_catalog.rs (cargo test), both in the CI gate.
      #   "A nightly job installs the latest CLIs and reports any flag the
      #   catalog uses that no longer exists":
      #     .github/workflows/agent-cli-drift.yml, with unit tests in
      #     src/__tests__/agent-catalog-drift.test.ts.
      F06-3:
        text: "A custom agent launches in a terminal and shows in the sidebar with its name"
        scenarios: [F06-custom-agent.mjs]
  F09:
    # Behind the honestIsolation flag (off on stable until proven); the
    # scenario turns it on. With the flag off it must fail (negative control:
    # HERMES_E2E_F09_FLAG=off).
    name: "Honest isolation: tasks never share a checkout by accident"
    status: partial
    criteria:
      F09-1:
        text: "Creating a session on a branch already checked out elsewhere shows the blocking choice; no code path returns is_shared: true"
        scenarios: [F09-honest-isolation.mjs]
      F09-2:
        text: "Closing a dirty session offers commit-to-branch, and the stash stack is unchanged afterwards"
        scenarios: [F09-honest-isolation.mjs]
      F09-3:
        text: "Worktree branches default to hermes/<slug>"
        scenarios: [F09-honest-isolation.mjs]
      F09-4:
        text: "A restored session keeps its session id and its worktree link"
        scenarios: [F09-honest-isolation.mjs]
      F09-5:
        text: "Closing a session that reuses another session's worktree asks nothing about it and leaves that worktree, its uncommitted files and its link alone"
        scenarios: [F09-honest-isolation.mjs, F09-isolation-edge-cases.mjs]
      # F09-6 and F09-7 have a second negative control: with
      # HERMES_E2E_ISOLATION_FIXES=off (test builds only) the app behaves as
      # before the fixes and the scenario must end in RESULT: FAIL.
      F09-6:
        text: "A session that reuses a checkout made outside Hermes, or one of another Hermes instance, is closed like a shared checkout: no Uncommitted Changes dialog, no cleanup, no warning; the Branch In Use choice names that checkout's folder"
        scenarios: [F09-isolation-edge-cases.mjs]
      F09-7:
        text: "A restored session whose worktree folder was deleted never hangs at starting: the worktree is recreated on its branch, or the session opens in the project folder, and a message says which"
        scenarios: [F09-isolation-edge-cases.mjs]
  N03:
    name: "Fake agents and recorded sessions"
    status: partial
    criteria:
      N03-1:
        text: "The fake agent approval scenario changes the session status in the real app on all three OSes"
        scenarios: [N03-fake-agent.mjs]
  F04:
    name: "Private by default"
    # partial: the scenario proves no analytics traffic while off; a full
    # 10-minute network capture is not automated.
    status: partial
    criteria:
      F04-1:
        text: "A fresh profile has telemetry_enabled=false"
        scenarios: [F04-private-by-default.mjs]
      F04-2:
        text: "With telemetry off, a network capture during a 10-minute session shows only update-check traffic"
        scenarios: [F04-private-by-default.mjs]
      F04-3:
        text: "Delete session data removes Hermes caches for the chosen session and leaves the repo intact"
        scenarios: [F04-private-by-default.mjs]
  F02:
    name: "Crash containment and startup diet"
    status: partial
    criteria:
      F02-1:
        text: "A crash inside one pane or agent block renders an error card there while the other panes keep rendering"
        scenarios:
          - F02-crash-containment.mjs
      F02-2:
        text: "Startup JS is at or under 1.2 MB, enforced by a CI job that fails on regression"
        scenarios: []
      F02-3:
        text: "Cold start and idle RAM are published in the 1.4.1 release notes"
        scenarios: []
  N23:
    name: "Docs that stay true"
    status: partial
    criteria:
      N23-1:
        text: "The Shortcuts panel in the running app lists exactly the generated shortcuts (native menu plus app-handled bindings), localized, with no stale or hand-written entries"
        scenarios: [N23-shortcuts-panel.mjs]
      N23-2:
        text: "Removing a shortcut from the menu changes the generated table"
        scenarios: [N23-docs-gates.mjs]
      N23-3:
        text: "A README claim with no scenario fails CI"
        scenarios: [N23-docs-gates.mjs]
  N09:
    name: "Terminal mode first, for every agent"
    # Proven on macOS and Linux only: the fake claude the scenario puts on
    # PATH is a POSIX shell script, so nothing runs it on Windows yet.
    status: partial
    criteria:
      N09-1:
        text: "A new Claude session opens the Claude terminal interface"
        scenarios:
          - "N09-terminal-first.mjs@darwin,linux"
      N09-2:
        text: "Choosing Agent view for Claude once makes it the preselected choice for Claude next time"
        scenarios:
          - "N09-terminal-first.mjs@darwin,linux"
      N09-3:
        text: "A saved Agent-view session restores in Agent view"
        scenarios:
          - "N09-terminal-first.mjs@darwin,linux"
  F17:
    name: "ADR 003: terminal first, vendor-neutral"
    # Documents (ADR 003, DESIGN_PRINCIPLES.md, README); no scenario reads
    # them. N09 proves the behaviour they describe.
    status: partial
    criteria:
      F17-1:
        text: "ADR 003 is merged and the design principles match it"
        scenarios: []
      F17-2:
        text: "The README lists every agent under Terminal, with Agent view marked optional for Claude"
        scenarios: []
  F01:
    name: "Honest copy and the Nous line"
    # README, CLAUDE.md and ADR 001 are documents, and the About dialog is a
    # native window the bridge cannot read (a Rust unit test covers its text).
    status: partial
    criteria:
      F01-1:
        text: "README has no 'Execution timeline' string and includes the non-affiliation line"
        scenarios: []
      F01-2:
        text: "The About dialog shows the non-affiliation line"
        scenarios: []
      F01-3:
        text: "CLAUDE.md and ADR 001 describe the SDK bridge, not claude --print"
        scenarios: []
      F01-4:
        text: "The ShortcutsPanel lists every accelerator in menu/mod.rs, and none are stale"
        # The panel is generated from the menu (N23); that scenario checks
        # every row against the generator's output.
        scenarios: [N23-shortcuts-panel.mjs]
  N11:
    name: "Defect sweep from the review"
    # Proven on macOS locally. The scenarios set up zsh/sh in a private home,
    # so they are macOS-only until Linux and Windows variants exist and the
    # E2E workflow runs them; until then the gate does not require results.
    status: planned
    criteria:
      N11-1:
        text: "With two agents in two projects, each session shows its own transcript"
        scenarios: [N11-transcript-per-project.mjs@darwin]
      N11-2:
        text: "Workbench layout and notes survive a restart"
        scenarios: [N11-workbench-notes-restore.mjs@darwin]
      N11-3:
        text: "A directory change split across reads still updates the header"
        scenarios: [N11-split-cwd-report.mjs@darwin]
      N11-4:
        text: "Gemini and Copilot install hints install the command Hermes checks for and launches"
        scenarios: [N11-install-hints.mjs@darwin, N11-copilot-cli.mjs@darwin]
  F13:
    name: "Agent view: approvals cannot be accepted by accident"
    status: shipped
    criteria:
      F13-1:
        text: "Pressing Enter while typing never resolves an approval"
        scenarios: [F13-approval-safety.mjs]
      F13-2:
        text: "An always-allow rule is written to the repo's local settings file"
        scenarios: [F13-approval-safety.mjs]
  N10:
    name: "Updates never kill a working agent"
    status: shipped
    criteria:
      N10-1:
        text: "With an agent working, an available update does not relaunch the app"
        scenarios: [N10-update-waits-for-idle.mjs]
      N10-2:
        text: "When all agents are idle, the update installs as today"
        scenarios: [N10-update-waits-for-idle.mjs]
  F05:
    name: "Terminal-faithful keys on Windows and Linux"
    status: partial
    criteria:
      F05-1:
        text: "On Windows and Linux, Ctrl+D in a focused terminal sends end-of-input and does not split the pane (real key press on a CI runner)"
        scenarios:
          - F05-terminal-keys.mjs@linux,win32
      F05-2:
        text: "Ctrl+Shift+D splits the pane from a focused terminal"
        scenarios:
          - F05-terminal-keys.mjs@linux,win32
      F05-3:
        text: "The keymap scenario runs nightly on all three OSes"
        scenarios: [F05-terminal-keys.mjs]
  FIX-close-before-quit:
    # A bug fix, not new 2.0 work, so it is not behind a feature flag.
    # Negative controls (run by hand, see the scenario header): a build
    # without the fix, and one with only the frontend half of it, both end
    # in RESULT: FAIL at the first relaunch.
    name: "A session closed just before quitting stays closed"
    status: shipped
    criteria:
      FIX-close-before-quit-1:
        text: "Create two sessions, close one (through its close button, confirming the close dialog if it asks), quit within 1 s, relaunch: only the remaining session comes back"
        scenarios: [FIX-close-before-quit.mjs]
      FIX-close-before-quit-2:
        text: "Closing a session drops it from the saved workspace within 2 s, even when the app is killed right after the close"
        scenarios: [FIX-close-before-quit.mjs]
  FIX-sessions-survive-quit:
    # A bug fix, not new 2.0 work, so it is not behind a feature flag.
    # Negative controls (run by hand, see the scenario header): a build of
    # main before the fix ends in RESULT: FAIL at run 3, and one where
    # quitting does not wait for the frontend at run 4, and one with the
    # frontend's own window-close handler put back fails run 4 on repeats.
    # Not driven: a real Cmd+Q key press (the rig never sends OS input on
    # macOS; the menu item is chosen through its own handler) and quits the
    # OS forces (logging out, the Dock's Quit), which no app can hold.
    name: "Sessions are never lost on quit"
    status: shipped
    criteria:
      FIX-sessions-survive-quit-1:
        text: "Save one session, relaunch, quit 500 ms after the UI shows it, relaunch: the session is there"
        scenarios: [FIX-sessions-survive-quit.mjs]
      FIX-sessions-survive-quit-2:
        text: "A session created 100 ms before quitting comes back, whether the quit is the app menu's Quit, closing the window, or an exit the app asks for"
        scenarios: [FIX-sessions-survive-quit.mjs]
      FIX-sessions-survive-quit-3:
        text: "A session closed just before quitting still stays closed"
        scenarios: [FIX-sessions-survive-quit.mjs, FIX-close-before-quit.mjs]
  N12:
    name: "Agents start reliably, with no typing into your shell"
    # partial: fish is not covered by a scenario yet (zsh and bash on macOS
    # and Linux, PowerShell and cmd on Windows are), and the startup-prompt
    # report exists only for agents whose catalog entry has a hook file with
    # a start event (Claude today; Codex, Gemini and the rest get no guess).
    # Passing trust per launch is not built; the prompt is reported instead.
    status: partial
    criteria:
      N12-1:
        text: "The same launch works in zsh, bash, fish, PowerShell and cmd"
        scenarios: [N12-launch-and-resume.mjs]
      N12-2:
        text: "A new worktree that triggers a trust prompt raises an inbox item within 5 seconds"
        scenarios: [N12-launch-and-resume.mjs]
      N12-3:
        text: "Hermes never writes to the vendor's global config"
        scenarios: [N12-launch-and-resume.mjs]
      N12-4:
        # Review finding: the report was only ever cleared by a start or end
        # signal, so an agent that went on without one stayed "waiting".
        text: "The startup-prompt report clears when the prompt is answered, even when the agent sends no start signal, and when the agent exits"
        scenarios: [N13-interrupted-resume.mjs, N12-launch-and-resume.mjs]
  N13:
    name: "Resume every agent after a restart or crash"
    # partial: N13-2 is covered indirectly (a restored plain terminal keeps
    # its worktree; the link is keyed by the session id, which a restored
    # agent session keeps too), not by a restored agent session itself.
    status: partial
    criteria:
      N13-1:
        text: "Quit and reopen: the Claude session continues the same conversation"
        scenarios: [N12-launch-and-resume.mjs]
      N13-2:
        # Restored sessions keep their id (the worktree link is keyed by it);
        # the honest-isolation scenario relaunches and checks the branch.
        text: "A restored session still points at its worktree and branch"
        scenarios: [F09-honest-isolation.mjs]
      N13-3:
        text: "A failed resume prints one line and starts a new conversation"
        scenarios: [N12-launch-and-resume.mjs]
      N13-4:
        # Only the vendor's own "no such conversation" (catalog: exit code and
        # message) replaces a conversation; an interrupt never does.
        text: "Ctrl-C at a resumed agent's startup prompt keeps the conversation: the next launch resumes the same one"
        scenarios: [N13-interrupted-resume.mjs]
      N13-5:
        # The old id stays until the fresh conversation has started.
        text: "When a failed resume starts a new conversation that is interrupted before it starts, the session keeps the previous conversation"
        scenarios: [N13-interrupted-resume.mjs]
  F11:
    name: "Zero-setup signals and status strip"
    # partial: proven with a fake Claude and the fake terminal agent on all
    # three OSes. Codex (notify + OSC 9), Gemini (defaults file), Copilot
    # (plugin folder), Antigravity and goose (worktree hook file) and OpenCode
    # (event stream) are unit-tested against their documented shapes, not
    # driven on the real app; the real claude and codex CLIs are exercised
    # only by the local-only script e2e/app/local/F11-real-agents-local.mjs
    # (needs the maintainer's logins, so it is not in this ledger; the real
    # Claude passed, the real Codex could not complete a turn on that
    # account). Claude over SSH (in-band markers) is unit-tested, not run
    # against a real host.
    status: partial
    criteria:
      F11-1:
        # The source (hook) is the strip's data-source.
        text: "A Claude session waiting for permission shows \"needs approval\" with source \"exact · reported by Claude Code\" within one second"
        scenarios: [F11-zero-setup-signals.mjs]
      F11-2:
        text: "Your own ~/.claude/settings.json is byte-identical before and after a session"
        scenarios: [F11-zero-setup-signals.mjs, N12-launch-and-resume.mjs]
      F11-3:
        text: "A notification printed by any program raises attention marked \"signal\", never \"exact\""
        scenarios: [F11-zero-setup-signals.mjs]
      F11-4:
