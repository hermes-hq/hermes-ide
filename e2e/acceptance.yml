# Acceptance ledger: which real-app scenario proves which feature.
#
# `node e2e/acceptance-check.mjs` reads this file. A feature with
# `status: shipped` fails the gate when any of its criteria has no scenario,
# names a scenario file that is not under e2e/app/scenarios/, or — in CI,
# where the results of all runners are checked — has a scenario that is
# missing or red on a platform it must be green on.
#
#   status:     planned  nothing is required yet
#               partial  listed scenarios must exist and be green; gaps allowed
#               shipped  every criterion needs at least one green scenario
#   scenarios:  file names under e2e/app/scenarios/. A scenario must be green
#               on macOS, Windows and Linux unless it names its platforms:
#               "<file>.mjs@linux" or "<file>.mjs@darwin,win32".
#
# Keep it plain: nested maps, "- item" or [a, b] lists, and "#" comments.

features:
  N01:
    name: "Proof rig: tests that drive the real app"
    status: shipped
    criteria:
      N01-1:
        # CI runs it 20 times on every pull request, on main and in the
        # merge queue (a manual run can pick another count). "No focus
        # stolen" is asserted on macOS; on Windows and Linux (bare runners
        # where nobody is typing) the focus state is only logged.
        text: "The terminal-echo scenario passes 20 times in a row on macOS, Windows and Linux runners"
        scenarios: [terminal-echo.mjs]
      N01-2:
        text: "A release build with the e2e feature fails to compile; without HERMES_E2E=1 the app opens no socket"
        scenarios: [N01-release-refuses-e2e.mjs@linux, N01-bridge-safety.mjs]
      N01-3:
        text: "Requests without the token are refused; the socket is bound to 127.0.0.1 only"
        scenarios: [N01-bridge-safety.mjs]
      N01-4:
        # The gate runs twice: in CI over the runners' results, and again in
        # the release workflow, which also refuses a commit whose CI gate
        # did not pass.
        text: "A feature marked shipped with no green scenario on all three OSes fails the release gate"
        scenarios: [N01-acceptance-gate.mjs]
  N02:
    name: "Hermes instances never clobber each other"
    status: partial
    criteria:
      N02-1:
        # Uses lsof to read which files each build has open, so not on Windows.
        text: "A test build pointed at the installed app's data folder refuses to start; two builds side by side leave each other's and the installed app's files alone"
        scenarios:
          - "N02-instance-isolation.mjs@darwin,linux"
  F03:
    name: "Hermes never types into a terminal on its own"
    status: shipped
    # "knip runs in CI with zero unused exports or files" is enforced by the
    # Frontend job in .github/workflows/ci.yml (npx knip); it is not app
    # behaviour, so no real-app scenario proves it.
    criteria:
      F03-1:
        text: "No code path writes a predicted command into a terminal: no Manual/Assisted/Auto switch, no Autonomous settings, and a 1.4.0 user's Auto mode types nothing"
        # The "types nothing" check is a guard only: the 1.4.0 pipeline never
        # fired in the rig, so it has no failing run against an old build. The
        # proof that nothing can type is that the code is gone (knip in CI
        # fails on anything left unused) plus the unit tests.
        scenarios: [F03-retire-autopilot.mjs]
      F03-2:
        text: "With an agent CLI in the foreground no ghost text or suggestion list renders; at a plain shell prompt they still do"
        scenarios: [F03-retire-autopilot.mjs]
      F03-3:
        text: "A 1.4.0 database migrates and loses only execution_nodes, which its backup keeps"
        scenarios: [F03-retire-autopilot.mjs, N06-db-migrations.mjs]
  N05:
    name: "Safe release train with a beta channel"
    # The train itself (draft, smoke on every OS, beta first, promote later)
    # runs in GitHub Actions and is exercised by its dry run; the two parts
    # that live in the app are proven here.
    status: partial
    criteria:
      N05-1:
        text: "A build whose installed self-test fails on any OS never becomes the latest release"
        scenarios: [N05-self-test.mjs]
      N05-2:
        text: "Beta users get a build at least 24 hours before stable users"
        scenarios: [N05-update-channel.mjs]
      N05-3:
        text: "Re-running a release never moves a tag"
        scenarios: []
      N05-4:
        text: "A release without hand-written notes for its version fails"
        scenarios: []
  N06:
    name: "Upgrades never lose data"
    status: shipped
    criteria:
      N06-1:
        text: "Every captured database opens in the new build with the same row counts"
        scenarios: [N06-db-migrations.mjs]
      N06-2:
        text: "Updating from the previous release keeps sessions, settings, saved hosts and plugins"
        scenarios: [N06-db-migrations.mjs]
      N06-3:
        text: "Opening a database from a newer version shows a clear message and changes nothing"
        scenarios: [N06-db-migrations.mjs]
  SEC-plugin-identity:
    name: "Plugin commands are bound to the calling plugin"
    status: shipped
    criteria:
      SEC-plugin-identity-1:
        text: "A plugin that calls the app directly naming another plugin's id, or trying to grant itself permissions, is refused and leaves no trace"
        scenarios: [SEC-plugin-identity-two-plugins.mjs]
      SEC-plugin-identity-2:
        text: "A well-behaved plugin (storage + network, like the GitHub plugin) keeps working through the plugin API"
        scenarios: [SEC-plugin-identity-two-plugins.mjs]
      SEC-plugin-identity-3:
        text: "A plugin cannot list the installed plugins, read their permissions or code, or fetch a URL through the registry check"
        scenarios: [SEC-plugin-identity-two-plugins.mjs]
  N07:
    name: "Feature flags"
    status: shipped
    criteria:
      N07-1:
        text: "A flagged feature is invisible on stable and visible on beta"
        scenarios: [N07-feature-flags.mjs]
      N07-2:
        text: "Turning a flag off hides the feature on next launch"
        scenarios: [N07-feature-flags.mjs]
  N14:
    name: "Disk guard and worktree hygiene"
    status: partial
    criteria:
      N14-1:
        # The free space is a test-only override (HERMES_E2E_FREE_SPACE_BYTES,
        # e2e builds only); 4.2 GB is refused, 50 GB is allowed.
        text: "Below 10 GB free, creating a task shows the reason and creates nothing"
        scenarios: [N14-disk-guard.mjs]
      N14-2:
        # Proven today: "Remove build output" frees the space shown. Doing it
        # automatically when a task is archived or landed waits for Archive
        # (F09) and Land (F22), which call the same command.
        text: "Archiving a task removes its build output and frees the space shown"
        scenarios: []
      N14-3:
        text: "Orphaned worktree folders are listed and removable in one action"
        scenarios: [N14-disk-guard.mjs]
  F07:
    name: "Agent view: respawn lock and clear errors"
    status: shipped
    criteria:
      F07-1:
        # Retry is clicked twice at once; the app's own spawn log and the fake
        # bridge's log must each show one new process. The same scenario then
        # turns the lock off (test builds only) and must see two.
        text: "Two concurrent restarts for one session produce exactly one process"
        scenarios: [F07-agent-view-respawn.mjs]
      F07-2:
        text: "A signed-out Claude shows \"signed out\" with a Sign in action"
        scenarios: [F07-agent-view-respawn.mjs]
  F06:
    name: "Agent catalog as data"
    status: partial
    criteria:
      # Not app behaviour, so proven outside this ledger:
      #   "The catalog loads from one file validated by a schema test" and
      #   "No deprecated install command remains":
      #     src/__tests__/agent-catalog.test.ts (vitest) and
      #     src-tauri/src/agent_catalog.rs (cargo test), both in the CI gate.
      #   "A nightly job installs the latest CLIs and reports any flag the
      #   catalog uses that no longer exists":
      #     .github/workflows/agent-cli-drift.yml, with unit tests in
      #     src/__tests__/agent-catalog-drift.test.ts.
      F06-3:
        text: "A custom agent launches in a terminal and shows in the sidebar with its name"
        scenarios: [F06-custom-agent.mjs]
  F09:
    # Behind the honestIsolation flag (off on stable until proven); the
    # scenario turns it on. With the flag off it must fail (negative control:
    # HERMES_E2E_F09_FLAG=off).
    name: "Honest isolation: tasks never share a checkout by accident"
    status: partial
    criteria:
      F09-1:
        text: "Creating a session on a branch already checked out elsewhere shows the blocking choice; no code path returns is_shared: true"
        scenarios: [F09-honest-isolation.mjs]
      F09-2:
        text: "Closing a dirty session offers commit-to-branch, and the stash stack is unchanged afterwards"
        scenarios: [F09-honest-isolation.mjs]
      F09-3:
        text: "Worktree branches default to hermes/<slug>"
        scenarios: [F09-honest-isolation.mjs]
      F09-4:
        text: "A restored session keeps its session id and its worktree link"
        scenarios: [F09-honest-isolation.mjs]
      F09-5:
        text: "Closing a session that reuses another session's worktree asks nothing about it and leaves that worktree, its uncommitted files and its link alone"
        scenarios: [F09-honest-isolation.mjs]
  N03:
    name: "Fake agents and recorded sessions"
    status: partial
    criteria:
      N03-1:
        text: "The fake agent approval scenario changes the session status in the real app on all three OSes"
        scenarios: [N03-fake-agent.mjs]
  F04:
    name: "Private by default"
    # partial: the scenario proves no analytics traffic while off; a full
    # 10-minute network capture is not automated.
    status: partial
    criteria:
      F04-1:
        text: "A fresh profile has telemetry_enabled=false"
        scenarios: [F04-private-by-default.mjs]
      F04-2:
        text: "With telemetry off, a network capture during a 10-minute session shows only update-check traffic"
        scenarios: [F04-private-by-default.mjs]
      F04-3:
        text: "Delete session data removes Hermes caches for the chosen session and leaves the repo intact"
        scenarios: [F04-private-by-default.mjs]
  F02:
    name: "Crash containment and startup diet"
    status: partial
    criteria:
      F02-1:
        text: "A crash inside one pane or agent block renders an error card there while the other panes keep rendering"
        scenarios:
          - F02-crash-containment.mjs
      F02-2:
        text: "Startup JS is at or under 1.2 MB, enforced by a CI job that fails on regression"
        scenarios: []
      F02-3:
        text: "Cold start and idle RAM are published in the 1.4.1 release notes"
        scenarios: []
  N23:
    name: "Docs that stay true"
    status: partial
    criteria:
      N23-1:
        text: "The Shortcuts panel in the running app lists exactly the generated shortcuts (native menu plus app-handled bindings), localized, with no stale or hand-written entries"
        scenarios: [N23-shortcuts-panel.mjs]
      N23-2:
        text: "Removing a shortcut from the menu changes the generated table"
        scenarios: [N23-docs-gates.mjs]
      N23-3:
        text: "A README claim with no scenario fails CI"
        scenarios: [N23-docs-gates.mjs]
  N09:
    name: "Terminal mode first, for every agent"
    # Proven on macOS and Linux only: the fake claude the scenario puts on
    # PATH is a POSIX shell script, so nothing runs it on Windows yet.
    status: partial
    criteria:
      N09-1:
        text: "A new Claude session opens the Claude terminal interface"
        scenarios:
          - "N09-terminal-first.mjs@darwin,linux"
      N09-2:
        text: "Choosing Agent view for Claude once makes it the preselected choice for Claude next time"
        scenarios:
          - "N09-terminal-first.mjs@darwin,linux"
      N09-3:
        text: "A saved Agent-view session restores in Agent view"
        scenarios:
          - "N09-terminal-first.mjs@darwin,linux"
  F17:
    name: "ADR 003: terminal first, vendor-neutral"
    # Documents (ADR 003, DESIGN_PRINCIPLES.md, README); no scenario reads
    # them. N09 proves the behaviour they describe.
    status: partial
    criteria:
      F17-1:
        text: "ADR 003 is merged and the design principles match it"
        scenarios: []
      F17-2:
        text: "The README lists every agent under Terminal, with Agent view marked optional for Claude"
        scenarios: []
  F01:
    name: "Honest copy and the Nous line"
    # README, CLAUDE.md and ADR 001 are documents, and the About dialog is a
    # native window the bridge cannot read (a Rust unit test covers its text).
    status: partial
    criteria:
      F01-1:
        text: "README has no 'Execution timeline' string and includes the non-affiliation line"
        scenarios: []
      F01-2:
        text: "The About dialog shows the non-affiliation line"
        scenarios: []
      F01-3:
        text: "CLAUDE.md and ADR 001 describe the SDK bridge, not claude --print"
        scenarios: []
      F01-4:
        text: "The ShortcutsPanel lists every accelerator in menu/mod.rs, and none are stale"
        # The panel is generated from the menu (N23); that scenario checks
        # every row against the generator's output.
        scenarios: [N23-shortcuts-panel.mjs]
  N11:
    name: "Defect sweep from the review"
    # Proven on macOS locally. The scenarios set up zsh/sh in a private home,
    # so they are macOS-only until Linux and Windows variants exist and the
    # E2E workflow runs them; until then the gate does not require results.
    status: planned
    criteria:
      N11-1:
        text: "With two agents in two projects, each session shows its own transcript"
        scenarios: [N11-transcript-per-project.mjs@darwin]
      N11-2:
        text: "Workbench layout and notes survive a restart"
        scenarios: [N11-workbench-notes-restore.mjs@darwin]
      N11-3:
        text: "A directory change split across reads still updates the header"
        scenarios: [N11-split-cwd-report.mjs@darwin]
      N11-4:
        text: "Gemini and Copilot install hints install the command Hermes checks for and launches"
        scenarios: [N11-install-hints.mjs@darwin, N11-copilot-cli.mjs@darwin]
