  F25:
    name: "Windows signing, winget and AppImage"
    # Windows code signing needs a signing identity only a person can obtain,
    # so it is not part of this work; the other criteria are proven here.
    status: partial
    criteria:
      F25-1:
        text: "Windows installers show a verified publisher"
        scenarios: []
      F25-2:
        # Installs the newest published release's real installer through the
        # manifests the release workflow generates (submitting them to
        # microsoft/winget-pkgs is a one-time human step).
        text: "\"winget install\" works"
        scenarios:
          - F25-winget-install.mjs@win32
      F25-3:
        # Measured against 1.4.0 (release dry run): macOS DMG 122 -> 98 MB,
        # macOS update archive 120 -> 96 MB, .deb 133 -> 107 MB, installed
        # macOS app 310 -> 118 MB; the Windows installer grows 94 -> 103 MB
        # (its LZMA packed the raw runtime better than zstd does). Shipping an
        # uncompressed tar on Windows would bring it back to about 95 MB but
        # keep 260 MB instead of 79 MB on disk (measurement in ADR 002), so
        # zstd stays. Downloads were already compressed, so no installer can
        # shrink by 150 MB while the runtime is bundled; the criterion stays
        # open.
        text: "The installer is at least 150 MB smaller"
        scenarios: []
      F25-4:
        text: "The Claude bridge runtime ships as one archive, unpacks on first use, is reused after that, repaired when damaged and replaced on update; a damaged archive is refused"
        scenarios: [F25-bridge-runtime.mjs]
      F25-5:
        text: "The Linux AppImage installs, passes its self-test and updates itself to a newer release; an update with a wrong signature is refused"
        scenarios:
          - F25-appimage-update.mjs@linux
      F25-6:
        text: "An Agent view session starts its bridge from the unpacked runtime, imports the SDK from it and answers; with a damaged archive no bridge starts and the view says why"
        scenarios: [F25-agent-session-runtime.mjs]
