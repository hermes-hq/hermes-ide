# Acceptance ledger: which real-app scenario proves which feature.
#
# `node e2e/acceptance-check.mjs` reads this file. A feature with
# `status: shipped` fails the gate when any of its criteria has no scenario,
# names a scenario file that is not under e2e/app/scenarios/, or — in CI,
# where the results of all runners are checked — has a scenario that is
# missing or red on a platform it must be green on.
#
#   status:     planned  nothing is required yet
#               partial  listed scenarios must exist and be green; gaps allowed
#               shipped  every criterion needs at least one green scenario
#   scenarios:  file names under e2e/app/scenarios/. A scenario must be green
#               on macOS, Windows and Linux unless it names its platforms:
#               "<file>.mjs@linux" or "<file>.mjs@darwin,win32".
#
# Keep it plain: nested maps, "- item" or [a, b] lists, and "#" comments.

features:
  N01:
    name: "Proof rig: tests that drive the real app"
    status: shipped
    criteria:
      N01-1:
        # CI runs it 20 times on every pull request, on main and in the
        # merge queue (a manual run can pick another count). "No focus
        # stolen" is asserted on macOS; on Windows and Linux (bare runners
        # where nobody is typing) the focus state is only logged.
        text: "The terminal-echo scenario passes 20 times in a row on macOS, Windows and Linux runners"
        scenarios: [terminal-echo.mjs]
      N01-2:
        text: "A release build with the e2e feature fails to compile; without HERMES_E2E=1 the app opens no socket"
        scenarios: [N01-release-refuses-e2e.mjs@linux, N01-bridge-safety.mjs]
      N01-3:
        text: "Requests without the token are refused; the socket is bound to 127.0.0.1 only"
        scenarios: [N01-bridge-safety.mjs]
      N01-4:
        # The gate runs twice: in CI over the runners' results, and again in
        # the release workflow, which also refuses a commit whose CI gate
        # did not pass.
        text: "A feature marked shipped with no green scenario on all three OSes fails the release gate"
        scenarios: [N01-acceptance-gate.mjs]
  N02:
    name: "Hermes instances never clobber each other"
    status: partial
    criteria:
      N02-1:
        # Uses lsof to read which files each build has open, so not on Windows.
        text: "A test build pointed at the installed app's data folder refuses to start; two builds side by side leave each other's and the installed app's files alone"
        scenarios:
          - "N02-instance-isolation.mjs@darwin,linux"
  F03:
    name: "Hermes never types into a terminal on its own"
    status: shipped
    # "knip runs in CI with zero unused exports or files" is enforced by the
    # Frontend job in .github/workflows/ci.yml (npx knip); it is not app
    # behaviour, so no real-app scenario proves it.
    criteria:
      F03-1:
        text: "No code path writes a predicted command into a terminal: no Manual/Assisted/Auto switch, no Autonomous settings, and a 1.4.0 user's Auto mode types nothing"
        # The "types nothing" check is a guard only: the 1.4.0 pipeline never
        # fired in the rig, so it has no failing run against an old build. The
        # proof that nothing can type is that the code is gone (knip in CI
        # fails on anything left unused) plus the unit tests.
        scenarios: [F03-retire-autopilot.mjs]
      F03-2:
        text: "With an agent CLI in the foreground no ghost text or suggestion list renders; at a plain shell prompt they still do"
        scenarios: [F03-retire-autopilot.mjs]
      F03-3:
        text: "A 1.4.0 database migrates and loses only execution_nodes, which its backup keeps"
        scenarios: [F03-retire-autopilot.mjs, N06-db-migrations.mjs]
  N06:
    name: "Upgrades never lose data"
    status: shipped
    criteria:
      N06-1:
        text: "Every captured database opens in the new build with the same row counts"
        scenarios: [N06-db-migrations.mjs]
      N06-2:
        text: "Updating from the previous release keeps sessions, settings, saved hosts and plugins"
        scenarios: [N06-db-migrations.mjs]
      N06-3:
        text: "Opening a database from a newer version shows a clear message and changes nothing"
        scenarios: [N06-db-migrations.mjs]
  SEC-plugin-identity:
    name: "Plugin commands are bound to the calling plugin"
    status: shipped
    criteria:
      SEC-plugin-identity-1:
        text: "A plugin that calls the app directly naming another plugin's id, or trying to grant itself permissions, is refused and leaves no trace"
        scenarios: [SEC-plugin-identity-two-plugins.mjs]
      SEC-plugin-identity-2:
        text: "A well-behaved plugin (storage + network, like the GitHub plugin) keeps working through the plugin API"
        scenarios: [SEC-plugin-identity-two-plugins.mjs]
      SEC-plugin-identity-3:
        text: "A plugin cannot list the installed plugins, read their permissions or code, or fetch a URL through the registry check"
        scenarios: [SEC-plugin-identity-two-plugins.mjs]
  N07:
    name: "Feature flags"
    status: partial
    criteria:
      N07-1:
        text: "A flagged feature is invisible on stable and visible on beta"
        scenarios: [N07-feature-flags.mjs]
      N07-2:
        text: "Turning a flag off hides the feature on next launch"
        scenarios: [N07-feature-flags.mjs]
  N14:
    name: "Disk guard and worktree hygiene"
    status: partial
    criteria:
      N14-1:
        # The free space is a test-only override (HERMES_E2E_FREE_SPACE_BYTES,
        # e2e builds only); 4.2 GB is refused, 50 GB is allowed.
        text: "Below 10 GB free, creating a task shows the reason and creates nothing"
        scenarios: [N14-disk-guard.mjs]
      N14-2:
        # Proven today: "Remove build output" frees the space shown. Doing it
        # automatically when a task is archived or landed waits for Archive
        # (F09) and Land (F22), which call the same command.
        text: "Archiving a task removes its build output and frees the space shown"
        scenarios: []
      N14-3:
        text: "Orphaned worktree folders are listed and removable in one action"
        scenarios: [N14-disk-guard.mjs]
  F07:
    name: "Agent view: respawn lock and clear errors"
    status: shipped
    criteria:
      F07-1:
        # Retry is clicked twice at once; the app's own spawn log and the fake
        # bridge's log must each show one new process. The same scenario then
        # turns the lock off (test builds only) and must see two.
        text: "Two concurrent restarts for one session produce exactly one process"
        scenarios: [F07-agent-view-respawn.mjs]
      F07-2:
        text: "A signed-out Claude shows \"signed out\" with a Sign in action"
        scenarios: [F07-agent-view-respawn.mjs]
