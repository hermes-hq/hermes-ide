[package]
name = "hermes-pty-host"
version = "0.1.0"
description = "Hermes session host: keeps terminals and their programs alive while the app is closed"
edition = "2021"

[lib]
name = "hermes_pty_host"
path = "src/lib.rs"

[[bin]]
name = "hermes-pty-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
strip = true
