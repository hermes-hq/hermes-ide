[package]
name = "hermes-ide"
version = "1.4.0"
description = "AI-native terminal"
authors = ["Gabriel Anhaia"]
edition = "2021"
[lib]
name = "hermes_ide_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "hermes-ide"
path = "src/main.rs"

[features]
# Test-only automation bridge (src/e2e_bridge.rs). Off by default and refuses
# to compile in a release build. The platform crates below are only for the
# bridge's in-process window screenshots.
e2e = [
  "dep:objc2",
  "dep:objc2-foundation",
  "dep:objc2-app-kit",
  "dep:objc2-web-kit",
  "dep:block2",
  "dep:gtk",
  "windows-sys/Win32_Foundation",
  "windows-sys/Win32_Graphics_Gdi",
  "windows-sys/Win32_Storage_Xps",
  "windows-sys/Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
  "std",
  "NSData",
  "NSError",
  "NSObject",
  "NSString",
  "NSValue",
] }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
  "std",
  "NSImage",
] }
objc2-web-kit = { version = "0.3", optional = true, default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "WKWebView",
  "WKSnapshotConfiguration",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Free disk space for the disk guard. The e2e feature adds what the bridge's
# window screenshots need.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-aptabase = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
rusqlite = { version = "0.39", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
strip-ansi-escapes = "0.2"
vte = { version = "0.14", default-features = false }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
walkdir = "2"
base64 = "0.22"
regex = "1"
lazy_static = "1"
sysinfo = { version = "0.39.6", features = ["system", "user"] }
git2 = { version = "0.20", features = ["vendored-openssl"] }
ignore = "0.4"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time"] }
arboard = { version = "3", features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
flate2 = "1"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
tar = "0.4"
anyhow = "1"
notify = "8"
dunce = "1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "analyzer"
harness = false
