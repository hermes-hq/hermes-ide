[package]
name = "hi"
version = "0.1.0"
description = "Hermes launch and signal helper"
edition = "2021"

[[bin]]
name = "hi"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
strip = true
