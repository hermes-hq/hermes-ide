# README claims ledger: which real-app scenario proves which README claim.
#
# `node scripts/check-readme-claims.mjs` reads this file, README.md and
# e2e/acceptance.yml, and fails when:
#   - a bullet under README.md's "## Features" heading has no
#     `<!-- claim:<id> -->` tag (or that heading is gone)
#   - a line in README.md is tagged `<!-- claim:<id> -->` but has no entry here
#   - a claim here has no matching tagged line in README.md, or its `text` is
#     not found in that line (the map has drifted from what README.md says)
#   - a claim names no scenario and is not listed as `unproven`, or names a
#     scenario that e2e/acceptance.yml does not reference from any feature's
#     criteria, or that does not exist under e2e/app/scenarios/
#
# Each claim either names the scenario that proves it:
#     scenario: terminal-echo.mjs          (or scenarios: [a.mjs, b.mjs])
# or is explicitly, visibly unproven, with the reason:
#     unproven: "No real-app scenario proves this yet"
# The gate prints every unproven claim on each run. When a scenario starts
# proving one, replace `unproven` with `scenario`.
#
# To add a feature bullet: end it with `<!-- claim:<id> -->`, then add an
# entry below with the same id, a distinctive substring of the line as
# `text`, and its scenario (or `unproven` and why).

claims:
  agent-chat:
    text: "Real chat for Claude"
    unproven: "No real-app scenario proves this yet"
  agent-images:
    text: "Real images"
    unproven: "No real-app scenario proves this yet"
  agent-persistent-conversations:
    text: "Persistent conversations"
    unproven: "No real-app scenario proves this yet"
  agent-own-auth:
    text: "Bring your own auth"
    unproven: "No real-app scenario proves this yet"
  multi-session:
    text: "Multi-session management"
    # terminal-echo creates a terminal session, finds it in the session list and
    # closes it again. Switching between parallel sessions is not covered yet.
    scenario: terminal-echo.mjs
  split-panes:
    text: "Split panes"
    unproven: "No real-app scenario proves this yet"
  webgl-rendering:
