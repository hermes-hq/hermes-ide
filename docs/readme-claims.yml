# README claims ledger: which real-app scenario proves which README claim.
#
# `node scripts/check-readme-claims.mjs` reads this file, README.md and
# e2e/acceptance.yml, and fails when:
#   - a bullet under README.md's "## Features" heading has no
#     `<!-- claim:<id> -->` tag (or that heading is gone)
#   - a line in README.md is tagged `<!-- claim:<id> -->` but has no entry here
#   - a claim here has no matching tagged line in README.md, or its `text` is
#     not found in that line (the map has drifted from what README.md says)
#   - a claim names no scenario and is not listed as `unproven`, or names a
#     scenario that e2e/acceptance.yml does not reference from any feature's
#     criteria, or that does not exist under e2e/app/scenarios/
#   - an `unproven` claim's `planned` scenario has landed (on disk and in the
#     ledger) but the claim still says `unproven`
#   - in CI (--baseline): a claim is `unproven` here but was not in the target
#     branch, i.e. a new README claim arrived without a scenario
#   - with --strict (a visible, non-blocking CI job): any claim is `unproven`
#
# A claim names the scenario that proves it:
#     scenario: terminal-echo.mjs          (or scenarios: [a.mjs, b.mjs])
#
# The claims already in the README when this gate arrived, with no scenario
# yet, are a backlog that can only shrink. Each says so, and names the
# scenario planned to prove it:
#     unproven: "No real-app scenario proves this yet"
#     planned: git-panel.mjs
# When that scenario lands, replace both lines with `scenario:`.
#
# To add a feature bullet: end it with `<!-- claim:<id> -->`, then add an
# entry below with the same id, a distinctive substring of the line as
# `text`, and the scenario that proves it. A new claim cannot be `unproven`.

claims:
  agent-chat:
    text: "Structured conversation"
    unproven: "No real-app scenario proves this yet"
    planned: agent-chat.mjs
  agent-images:
    text: "Real images"
    unproven: "No real-app scenario proves this yet"
    planned: agent-images.mjs
  agent-persistent-conversations:
    text: "Persistent conversations"
    unproven: "No real-app scenario proves this yet"
    planned: N13-resume-agents.mjs
  agent-own-auth:
    text: "Bring your own auth"
    unproven: "No real-app scenario proves this yet"
    planned: agent-own-auth.mjs
  multi-session:
    text: "Multi-session management"
    # terminal-echo creates a terminal session, finds it in the session list and
    # closes it again. Switching between parallel sessions is not covered yet.
    scenario: terminal-echo.mjs
  split-panes:
    text: "Split panes"
    unproven: "No real-app scenario proves this yet"
    # N11-split-cwd-report.mjs is about a report split across two reads, not panes.
    planned: split-panes.mjs
  webgl-rendering:
    text: "WebGL-accelerated rendering"
    unproven: "No real-app scenario proves this yet"
    planned: webgl-rendering.mjs
  every-agent-terminal:
    text: "Every agent in its own terminal"
    # N09 opens Claude (a stand-in CLI) from the New Session wizard in its own
    # terminal; other agents use the same path but are not launched there.
    scenario: N09-terminal-first.mjs
  remember-agent-choice:
    text: "Remembers your choice per agent"
    scenario: N09-terminal-first.mjs
  agent-view-opt-in:
    text: "Opt in per session"
    scenario: N09-terminal-first.mjs
  git-panel:
